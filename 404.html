<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Not Found | CricPulse</title>
<link rel="icon" type="image/png" href="https://plain-apac-prod-public.komododecks.com/202610/29/m2TmM6SyQ9C7xurAhnjr/image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #0f172a;
    --i2: #64748b;
    --ac: #1a5cff;
    --ac-hover: #1348d6;
    --ln: #e2e8f0;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    /* Subtle dot pattern for a premium technical feel */
    background-image: radial-gradient(var(--ln) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* HEADER */
  header {
    padding: 24px 32px;
    display: flex;
    align-items: center;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: -0.02em;
  }
  .logo img {
    width: 28px;
    height: 28px;
    border-radius: 6px;
  }

  /* MAIN CONTENT */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  .error-code {
    font-size: clamp(100px, 18vw, 220px);
    font-weight: 800;
    line-height: 0.9;
    color: #f1f5f9; /* Very light slate, subtle background text */
    letter-spacing: -0.05em;
    margin-bottom: -10px;
    user-select: none;
  }

  h1 {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
    color: var(--ink);
    position: relative;
    z-index: 1;
  }

  p {
    font-size: 16px;
    color: var(--i2);
    line-height: 1.6;
    max-width: 440px;
    margin-bottom: 40px;
    position: relative;
    z-index: 1;
  }

  .actions {
    display: flex;
    gap: 12px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--ink);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
  }
  .btn-primary:hover {
    background: #1e293b;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
  }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ln);
  }
  .btn-secondary:hover {
    background: #f8fafc;
  }

  /* FOOTER */
  footer {
    padding: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--i2);
    border-top: 1px solid var(--ln);
    background: var(--bg);
  }
  footer a {
    color: var(--i2);
    text-decoration: none;
    transition: color 0.2s;
  }
  footer a:hover {
    color: var(--ink);
  }

  /* Mobile Adjustments */
  @media (max-width: 600px) {
    header { padding: 20px; justify-content: center; }
    .error-code { margin-bottom: 0px; }
    .actions { flex-direction: column; width: 100%; max-width: 300px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

  <header>
    <a href="/" class="logo">
      <img src="https://plain-apac-prod-public.komododecks.com/202610/29/m2TmM6SyQ9C7xurAhnjr/image.jpg" alt="CricPulse">
      CricPulse
    </a>
  </header>

  <main>
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>We searched the entire database but couldn't find the page you are looking for. It might have been moved, deleted, or never existed.</p>
    
    <div class="actions">
      <a href="/" class="btn btn-primary">Return to Homepage</a>
      <a href="/support" class="btn btn-secondary">Contact Support</a>
    </div>
  </main>

  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script> CricPulse. All rights reserved. &middot; <a href="/terms">Terms</a> &middot; <a href="/privacy">Privacy</a>
  </footer>

</body>
</html>
