/* ---------- Google sign-in / session helpers ---------- */
/* Always return to the clean page URL (no old #access_token or ?code= leftovers) */
const authRedirect = () => window.location.origin + window.location.pathname;
function cleanAuthUrl() {
  try {
    const u = new URL(window.location.href); let ch = false;
    if (u.hash.includes("access_token") || u.hash.includes("error")) { u.hash = ""; ch = true; }
    ["code","error","error_description"].forEach(k => { if (u.searchParams.has(k)) { u.searchParams.delete(k); ch = true; } });
    if (ch) history.replaceState(null, "", u.pathname + u.search + u.hash);
  } catch(e) {}
}
/* if a different account signs in on this device, don't show the previous account's local picks/XP */
function switchAcct(em) {
  if (S.le && S.le !== em) { Object.assign(S,{bal:0,xp:0,st:0,best:0,preds:[],cps:[],txs:[],slip:{},tickets:[]}); }
  S.le = em;
}
let AUTHED_ID = null, AUTH_P = null;
function applySession(session) {
  if (!session || !session.user) return Promise.resolve();
  if (AUTHED_ID === session.user.id) return AUTH_P || Promise.resolve();
  AUTHED_ID = session.user.id;
  AUTH_P = (async () => {
    cleanAuthUrl();
    const em = session.user.email || "";
    let profile = null, tx = [], realNotifs = [];
    try {
      profile = await CP_DB.getProfile(session.user.id);
      tx = await CP_DB.getTransactions(session.user.id);
      // NEW: Fetch actual notifications from database
      const { data } = await supabase.from('notifications')
        .select('*')
        .or(`user_id.eq.${session.user.id},user_id.is.null`)
        .order('created_at', { ascending: false })
        .limit(20);
      if (data) realNotifs = data;
    } catch(e) { console.error("Profile load failed", e); }
    
    switchAcct(em);
    S.user = {
      id: session.user.id,
      n: (profile && profile.display_name) || em.split('@')[0] || "Player",
      e: em
    };
    S.bal = (profile && profile.wallet && profile.wallet[0] && profile.wallet[0].balance) || 0;
    S.txs = (tx || []).map(t => ({
      type: t.type,
      amount: t.amount,
      n: t.description || t.note,
      status: t.status,
      date: new Date(t.created_at).toLocaleDateString("en-IN")
    }));
    
    // NEW: Map the real notifications into the UI format
    if (realNotifs.length > 0) {
      S.nts = realNotifs.map(n => ({
        t: n.title,
        d: n.body,
        i: n.icon || "bell",
        r: 0,
        ts: new Date(n.created_at).getTime()
      }));
    }

    save();
    render(); // Render Dashboard
  })();
  return AUTH_P;
}
async function doLogout() {
  /* 1. really end the Supabase session (this is what makes Google ask again next time) */
  try { if (window.CP_DB && CP_DB.authClient) await CP_DB.authClient.auth.signOut(); } catch(e) {}
  /* 2. fallback: remove any leftover stored Supabase tokens, in case signOut could not reach the server */
  try { Object.keys(localStorage).forEach(k => { if (/^sb-.*-auth-token/.test(k)) localStorage.removeItem(k); }); } catch(e) {}
  try { localStorage.removeItem("cp_session"); } catch(e) {}
  if (window.CP_DB && CP_DB.ready) { try { CP_DB.auth("logout", null).catch(()=>{}); } catch(e) {} }
  AUTHED_ID = null; AUTH_P = null;
  S.user = null; S.pub = "land"; S.pop = 0; closeSheet(); save(); cleanAuthUrl(); render(); scrollTo(0,0);
}

function lockPicks(ids) {
  const ok = ids.filter(id => left(mkt(id)) > 0);
  if (ok.length < ids.length) toast("Closed markets were skipped.","clock");
  if (!ok.length) { render(); return; }
  ok.forEach(id => { S.preds.push({id:Date.now()+Number(id), m:Number(id), p:S.slip[id], res:null, pay:0}); delete S.slip[id]; });
  S.xp += ok.length*10; note(ok.length+" pick"+(ok.length>1?"s":"")+" locked", "+"+ok.length*10+" XP. Results appear in My picks.","lock");
  save(); closeSheet(); toast("Locked "+ok.length+" pick"+(ok.length>1?"s":"")+". +"+ok.length*10+" XP","lock"); render();
}

function settle(id) {
  const p = S.preds.find(x => x.id == id); if (!p || p.res) return;
  const m = mkt(p.m), win = Math.random()*100 < (p.p=="A"?m.w:100-m.w); let c = null;
  if (win) {
    p.res = "w"; S.st++; S.best = Math.max(S.best,S.st); S.xp += 50; p.pay = Math.round(10*(p.p=="A"?m.oa:m.ob)); S.bal += p.pay; addTx("win",p.pay,ttl(m),"completed");
    const q = RW[Math.floor(Math.random()*RW.length)]; c = {v:q[0],t:q[1],code:q[2],cat:q[3],cl:0}; S.cps.push(c);
    note("Pick correct", ttl(m)+". "+inr(p.pay)+" added and a reward unlocked.","award");
  } else { p.res = "l"; S.st = 0; S.xp += 5; note("Pick incorrect", ttl(m)+". You earned 5 XP.","x"); }
  save(); render();
  sheet(`<h3 style="font-size:17px;margin-bottom:6px">${win?"Pick correct":"Pick incorrect"}</h3><p class="t2" style="margin-bottom:16px">${win?"You earned 50 XP and "+inr(p.pay)+" funds, and unlocked: <b>"+esc(c.t)+"</b>.":"You earned 5 XP for taking part. Try another market."}</p><button class="btn p w" data-a="sgo" data-v="${win?"rewards":"markets"}">${win?"Go to coupons":"Back to markets"}</button>`);
}

/* one-click handlers */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t) {
    if (S.pop && !e.target.closest(".pp")) { S.pop = 0; render(); }
    if (e.target.classList.contains("ov")) closeSheet();
    return;
  }
  const a = t.dataset.a, v = t.dataset.v;
  if (S.pop && a != "pop" && !e.target.closest(".pp")) S.pop = 0;

  switch(a) {
    case "nav": S.route = v; S.pop = 0; closeSheet(); render(); scrollTo(0,0); break;
    case "sgo": closeSheet(); S.route = v; render(); scrollTo(0,0); break;
    case "back": S.pop = 0; closeSheet(); S.route = S.user ? "home" : "land"; render(); scrollTo(0,0); break;
    case "page": S.pub = v; if (S.user) S.route = v; closeSheet(); render(); scrollTo(0,0); break;
    case "home0": S.pub = "land"; render(); scrollTo(0,0); break;
    case "auth": S.pub = "auth"; S.au = v; render(); break;
    case "gmail": {
      if (window.CP_DB && CP_DB.ready) {
        toast("Opening Google...", "clock");
        // prompt:'select_account' forces Google to show the list of emails every time
        CP_DB.authClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: authRedirect(),
            queryParams: { prompt: 'select_account' }
          }
        }).then(r => { if (r && r.error) toast(r.error.message, "x"); })
          .catch(err => toast(err.message, "x"));
      } else {
        toast("Supabase not ready", "x");
      }
      break;
    }
    case "guest": enter({n:"Guest User", e:"guest@cricpulse.com"}); break;
    case "subm": {
      const em = $("ae").value.trim(), pw = $("ap").value, fn = $("an") ? $("an").value.trim() : "", er = $("er");
      if (S.au == "up" && !fn) { er.textContent = "Enter your full name."; return; }
      if (!/^\S+@\S+\.\S+$/.test(em)) { er.textContent = "Enter a valid email address."; return; }
      if (pw.length < 6) { er.textContent = "Password must be at least 6 characters."; return; }
      // real Supabase auth if configured; otherwise local account
      if (window.CP_DB && CP_DB.ready) {
        S.authBusy = true; render();
        (async () => {
          try {
            if (S.au == "up") {
              await CP_DB.signUp(em, pw, { display_name: fn || em.split("@")[0] });
              toast("Account created. Please check your email if confirmation is on.","check");
            } else {
              const s = await CP_DB.signIn(em, pw);
              CP_DB.setSession(s);
            }
            enter({n:fn || em.split("@")[0], e:em});
          } catch (err) {
            S.authBusy = false; render();
            const er2 = $("er"); if (er2) er2.textContent = err.message || "Authentication failed.";
          }
        })();
      } else {
        enter({n:fn||em.split("@")[0], e:em});
      }
      break;
    }
    case "theme": S.theme = isDark() ? "light" : "dark"; applyTheme(); save(); closeSheet(); render(); break;
    case "more": moreSheet(); break;
    case "pop": S.pop = S.pop ? 0 : 1; render(); break;
    case "readall": S.nts.forEach(n => n.r = 1); save(); render(); break;
    case "cat": S.cat = v; render(); break;
    case "pick": case "mpick": {
      const [id,k] = v.split(":");
      if (left(mkt(id)) <= 0) { toast("This market has closed.","clock"); return; }
      if (a == "pick" && S.slip[id] == k) delete S.slip[id]; else S.slip[id] = k;
      render(); break;
    }
    case "rm": delete S.slip[v]; render(); if (!Object.keys(S.slip).length) closeSheet(); else slipSheet(); break;
    case "slipsheet": slipSheet(); break;
    case "lockslip": lockPicks(Object.keys(S.slip)); break;
    case "lockm": lockPicks([v]); break;
    case "open": S.route = "match"; S.mid = Number(v); S.pop = 0; render(); scrollTo(0,0); break;
    case "pff": S.pff = v; render(); break;
    case "nf": S.nf = v; render(); break;
    case "rk": S.rk = v; render(); break;
    case "txf": S.txf = v; render(); break;
    case "settle": settle(v); break;
    case "claim": { const c = S.cps[Number(v)]; if (!c || c.cl) return; c.cl = 1; S.xp += 20; note("Reward claimed", c.t+". Code: "+c.code, "gift"); save(); toast("Reward claimed. Code ready.","gift"); render(); break; }
    case "copy": try{navigator.clipboard.writeText(v)}catch(x){} toast("Code "+v+" copied","copy"); break;
    case "chk": S.chk = new Date().toDateString(); S.xp += 10; note("Daily check-in","+10 XP","star"); save(); toast("Checked in. +10 XP","star"); render(); break;
    case "pref": S.pf[v] = t.checked ? 1 : 0; save(); break;
    case "saven": { const n = $("dn").value.replace(/[<>"&]/g,"").trim(); if (!n) { toast("Name cannot be empty.","x"); return; } S.user.n = n; save(); toast("Profile updated.","user"); render(); break; }
    case "logout": {
      doLogout(); break;
    }
    case "support": S.route = "support"; render(); scrollTo(0,0); break;
    case "newticket": createTicket(); break;
    case "openticket": S.ticketOpen = Number(v); S.route = "ticket"; render(); setTimeout(() => { const msgs = $("msgs"); if (msgs) msgs.scrollTop = msgs.scrollHeight; }, 50); break;
    case "instagram": {
      const ig = (window.CP_CONFIG && window.CP_CONFIG.INSTAGRAM_HANDLE) || "cricpulse.official";
      window.open("https://instagram.com/" + ig, "_blank", "noopener");
      break;
    }
    case "sendmsg": {
      const ta = $("ti"), t2 = S.tickets.find(x => x.id == S.ticketOpen);
      if (!ta || !t2 || t2.status == "closed") return;
      const txt = ta.value.trim(); if (!txt) return;
      t2.msgs.push({me:true, text:txt, at:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})});
      t2.updated = "Just now"; ta.value = ""; save(); render();
      setTimeout(() => { const msgs = $("msgs"); if (msgs) msgs.scrollTop = msgs.scrollHeight; }, 50);
      // simulated support ack (real replies come from admin panel / Supabase)
      setTimeout(() => {
        const t3 = S.tickets.find(x => x.id == S.ticketOpen);
        if (t3 && t3.status != "closed") {
          t3.msgs.push({me:false, text:"Thanks for the message — our team will reply within "+(window.CP_CONFIG?.SUPPORT_REPLY_WINDOW||"60 minutes")+".", at:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})});
          t3.updated = "Just now"; save();
          if (S.route == "ticket") { render(); const msgs = $("msgs"); if (msgs) msgs.scrollTop = msgs.scrollHeight; }
        }
      }, 2500);
      break;
    }
    case "dep": depSheet(); break;
    case "damt": $("da").value = v; break;
    case "depok": {
      const x = Number($("da").value);
      if (!x || x < 50) { $("er").textContent = "Minimum deposit is ₹50."; return; }
      if (x > 100000) { $("er").textContent = "Maximum deposit is ₹1,00,000."; return; }
      
      if (typeof ZapUPI === 'undefined') {
        $("er").textContent = "Payment gateway not loaded. Please refresh.";
        return;
      }

      // Get the selected app from the hidden input
      const selectedApp = $("dm").value; 

      const orderId = 'ORD' + Date.now().toString(36) + Math.random().toString(36).substr(2, 6).toUpperCase();
      const currentUrl = window.location.origin + window.location.pathname;
      
      t.disabled = true;
      t.textContent = 'Creating payment...';

      if (window.CP_DB && CP_DB.ready) {
        CP_DB.rest('payment_requests', {
          method: 'POST',
          body: JSON.stringify({ user_id: S.user.e, txn_id: orderId, amount_inr: x, status: 'pending' })
        }).catch(e => console.error('Supabase insert failed', e));
      }

      ZapUPI.createOrder({
        zap_key: 'zapce570e671e2f07f3bc9837566a44ec4c', 
        order_id: orderId, 
        amount: x.toString(),
        preferred_app: selectedApp === 'upi' ? null : selectedApp, // 👈 THIS OPENS THE SPECIFIC APP
        success_url: currentUrl + '?status=success&order_id=' + orderId,
        failed_url: currentUrl + '?status=failed&order_id=' + orderId,
        timeout_url: currentUrl + '?status=timeout&order_id=' + orderId,
      }, {
        onResponse: function(paymentUrl) {
          if (paymentUrl) window.open(paymentUrl, '_blank');
          t.disabled = false;
          t.textContent = 'Continue to pay';
        },
        onError: function(err) {
          $("er").textContent = err || "Payment failed to initialize.";
          t.disabled = false;
          t.textContent = 'Continue to pay';
        }
      });
      break;
    }
    case "wd": if(S.bal < 100){toast("Minimum withdrawal is ₹100.","x"); return;} wdSheet(); break;
    case "wmax": $("wa").value = Math.floor(S.bal); break;
    case "wdok": {
      const x = Number($("wa").value), d = $("wt").value.trim(), er = $("er");
      if (!x || x < 100) { er.textContent = "Minimum withdrawal is ₹100."; return; }
      if (x > S.bal) { er.textContent = "Amount exceeds your balance."; return; }
      if (!d) { er.textContent = "Enter a destination."; return; }
      S.bal -= x; addTx("withdraw",x,"To "+mask(d),"pending"); note("Withdrawal requested",inr2(x)+" is being processed.","wallet"); save(); closeSheet(); toast("Withdrawal requested.","wallet"); render(); break;
    }
    case "wcancel": {
      const x = S.txs[Number(v)]; if (!x || x.status != "pending") return;
      x.status = "cancelled"; S.bal += x.amount; note("Withdrawal cancelled",inr2(x.amount)+" returned to your wallet.","x"); save(); toast("Withdrawal cancelled.","x"); render(); break;
    }
  }
});

function tick() {
  MK.forEach(m => {
    const L = LV[m.id], r = Math.random(), A = m.A[0], B = m.B[0];
    if (m.c == "cricket") {
      if (L.b >= 119) return;
      const o = [0,0,1,1,1,2,4,4,6,-1][Math.floor(r*10)];
      L.b++;
      if (o < 0) { if (L.w < 9) L.w++; L.lg.unshift(ov(L.b)+" ov: WICKET"); }
      else { L.r += o; L.lg.unshift(ov(L.b)+" ov: "+(o==4?"FOUR":o==6?"SIX":o?o+" run"+(o>1?"s":""):"Dot ball")); }
    } else if (m.c == "football") {
      if (L.n >= 90) return; L.n++;
      if (r < .05) { const k = Math.random()*100 < m.w ? 0 : 1; L.g[k]++; L.lg.unshift(L.n+"' GOAL, "+(k?B:A)); }
      else if (r < .12) L.lg.unshift(L.n+"' Corner, "+(r<.08?A:B));
    } else if (m.c == "kabaddi") {
      if (L.n >= 40) return; if (r < .5) L.n++;
      const k = r < .5 ? 0 : 1, p = 1+Math.floor(Math.random()*3);
      L.p[k] += p; L.lg.unshift("Raid: "+(k?B:A)+" +"+p);
    } else if (m.c == "esports") {
      if (L.rd[0] >= 13 || L.rd[1] >= 13) return;
      const k = r < m.w/100 ? 0 : 1; L.rd[k]++; L.lg.unshift("Round won by "+(k?B:A));
    } else {
      L.v += m.id==7 ? Math.random()*1.4 : (Math.random()-.45)*45;
      L.lg.unshift("Update: "+(m.id==7?"₹"+L.v.toFixed(1)+" cr":ni(L.v)));
    }
    L.lg = L.lg.slice(0,5);
  });
  document.querySelectorAll("[data-lb]").forEach(n => n.innerHTML = liveBoard(mkt(n.dataset.lb)));
  document.querySelectorAll("[data-lt]").forEach(n => n.textContent = liveText(mkt(n.dataset.lt)));
  document.querySelectorAll("[data-mini]").forEach(n => n.innerHTML = miniBoard());
}

async function checkPaymentReturn() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  const orderId = params.get('order_id');
  
  if (!orderId) return;

  if (status === 'success') {
    toast("Verifying payment...", "clock");
    
    setTimeout(async () => {
      try {
        if (window.CP_DB && CP_DB.ready) {
          // Verify with Supabase
          const data = await CP_DB.rest(`payment_requests?txn_id=eq.${orderId}&select=*`);
          if (data && data[0]) {
            const amt = data[0].amount_inr;
            
            // Mark payment as approved
            await CP_DB.rest(`payment_requests?txn_id=eq.${orderId}`, {
              method: 'PATCH',
              body: JSON.stringify({ status: 'approved' })
            });
            
            // NEW: Fetch current wallet balance and update database
            const { data: wData } = await supabase.from('wallet').select('balance').eq('user_id', S.user.id).single();
            let currentBal = wData ? wData.balance : 0;
            let newBal = currentBal + amt;

            // Update the database wallet table
            await supabase.from('wallet').update({ balance: newBal }).eq('user_id', S.user.id);

            // Add to Transactions table for history
            await supabase.from('transactions').insert({
              user_id: S.user.id,
              type: 'deposit',
              amount: amt,
              description: 'ZapUPI Deposit',
              status: 'completed'
            });

            // Update frontend
            S.bal = newBal;
            addTx("deposit", amt, "ZapUPI Deposit", "completed");
            note("Funds added", inr2(amt)+" added to your wallet via ZapUPI.", "wallet");
            save(); toast(`Payment successful! ₹${amt} added.`, "wallet"); render();
          }
        } else {
          toast("Payment successful. Balance synced.", "wallet");
        }
      } catch(e) {
        console.error('Payment verification failed', e);
      }
      window.history.replaceState({}, document.title, window.location.pathname);
    }, 2000);
    
  } else if (status === 'failed') {
    toast('Payment failed. Please try again.', 'xmark');
    window.history.replaceState({}, document.title, window.location.pathname);
  } else if (status === 'timeout') {
    toast('Payment timed out. Please try again.', 'xmark');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

/* init — avoids white flash & fixes the login loop */
window.addEventListener("load", async () => {
  try {
    applyTheme();
    
    if (!window.CP_DB || !CP_DB.authClient) {
      render();
      return;
    }

    // 1. Listen for login (Catches the Google Redirect)
    //    The handler only schedules work (no awaits inside), so the Supabase client is never blocked.
    CP_DB.authClient.auth.onAuthStateChange((event, session) => {
      if (session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
        setTimeout(() => applySession(session), 0);
      } else if (event === "SIGNED_OUT") {
        AUTHED_ID = null; AUTH_P = null;
        if (S.user && S.user.id) { S.user = null; save(); render(); } // Render Landing Page
      }
    });

     // 2. Fetch Live Matches from Supabase
    try {
      const liveMatches = await CP_DB.getMatches();
      // Only replace the hardcoded matches if there are matches in the database
      if (liveMatches && liveMatches.length > 0) {
        MK = liveMatches.map(m => ({
          id: m.id,
          c: m.category,
          lg: m.league,
          A: [m.team_a.split(' ')[0], m.team_a], 
          B: [m.team_b.split(' ')[0], m.team_b],
          q: m.question,
          // Calculate seconds left from the database closing time
          s: Math.max(0, Math.floor((new Date(m.closes_at).getTime() - Date.now()) / 1000)), 
          w: m.crowd_a,
          oa: m.odds_a,
          ob: m.odds_b
        }));
        
        // Initialize Live Feed for the new matches
        MK.forEach(m => {
           if (!LV[m.id]) {
             LV[m.id] = m.c == "cricket" ? {r:96, w:2, b:12, tg:180, lg:["Match started"]} : {v:100, lg:["Live"]};
           }
        });
      }
    } catch(e) { console.log("Using fallback matches (DB empty or unreachable)", e); }

    // 3. Check current session
    const { data: { session } } = await CP_DB.authClient.auth.getSession();
    
    if (session) {
      await applySession(session);
    } else {
      render();
    }
    checkPaymentReturn();

  } catch (err) {
    console.error("Init error:", err);
    render(); 
  }
});
