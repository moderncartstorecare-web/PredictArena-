.yc{container-type:inline-size;position:relative;overflow:hidden;color:var(--ink);font-family:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:24px;box-shadow:0 4px 20px rgba(15,23,41,.05)}
.yc button,.yc input{font:inherit;color:inherit}.yc button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.yc h3,.yc p,.yc dd,.yc fieldset{margin:0;padding:0}.yc svg{display:block;flex:none}
.yc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 16px;background:linear-gradient(180deg,var(--s2),var(--sf));border-bottom:1px solid var(--ln)}
.yc-title{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.yc-sub{margin-top:2px;font-size:12.5px;color:var(--i3);font-weight:500}
.yc-badges{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.yc-live{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:99px;background:var(--nos);color:var(--no);font-size:10.5px;font-weight:800;letter-spacing:.05em}
.yc-live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.yc-timer{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:var(--ams);color:var(--am);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.yc-form{display:grid;gap:20px;padding:20px}
.yc-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;padding:0;font-size:13px;font-weight:700;color:var(--i2)}
.yc-label small{font-size:11.5px;font-weight:500;color:var(--i3)}
.yc-picks{min-width:0;border:0}
.yc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yc-opt{position:relative;display:block;min-width:0}
.yc-opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.yc-card{position:relative;display:flex;flex-direction:column;gap:14px;height:100%;padding:16px;border:2px solid var(--ln2);border-radius:20px;background:var(--sf);transition:all .2s cubic-bezier(.4,0,.2,1)}
.yc-opt:hover .yc-card{border-color:var(--ln)}
.yc-opt input:active+.yc-card{transform:scale(.985)}
.yc-opt input:checked+.yc-card{border-color:var(--ac);background:var(--acs);box-shadow:0 4px 15px rgba(29,78,216,.15)}
.yc-top{display:flex;align-items:center;gap:10px;min-width:0;padding-right:24px}
.yc-mono{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 2px 4px rgba(0,0,0,.1)}
.yc-name{min-width:0;font-size:14px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yc-check{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--ln2);color:transparent;background:var(--sf);position:absolute;top:14px;right:14px;transition:all .15s}
.yc-opt input:checked+.yc-card .yc-check{background:var(--ac);border-color:var(--ac);color:#fff}
.yc-odds{display:flex;align-items:baseline;gap:6px;margin-top:4px;padding-right:8px}
.yc-odds b{font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.yc-odds span{font-size:12px;font-weight:700;color:var(--i3);line-height:1;margin-bottom:2px}
.yc-field{display:flex;align-items:center;gap:10px;height:64px;padding:0 16px;border:2px solid var(--ln2);border-radius:18px;background:var(--s2);transition:all .2s ease}
.yc-field:focus-within{border-color:var(--ac);background:var(--sf);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 15%,transparent)}
.yc-cur{font-size:26px;font-weight:800;color:var(--i3);line-height:1}
.yc-amt{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.yc-amt::placeholder{color:var(--ln2)}

.yc-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.yc-chip{height:44px;border:1.5px solid var(--ln2);border-radius:12px;background:var(--s2);font-size:13.5px;font-weight:700;color:var(--ink);transition:all .15s ease;display:flex;align-items:center;justify-content:center;padding:0}
.yc-chip:hover{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.yc-chip:active{transform:scale(.96)}

.yc-sum {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 22px 28px !important;
  border-radius: 18px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 10%, var(--sf)), color-mix(in srgb, var(--ac) 2%, var(--sf)));
  border: 1.5px solid color-mix(in srgb, var(--ac) 25%, var(--ln));
  box-sizing: border-box !important;
  width: 100%;
  margin: 0;
}
.yc-sum > div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  width: 100%;
  box-sizing: border-box;
}
.yc-sum dt { font-size: 13.5px; font-weight: 600; color: var(--i2); margin: 0; padding: 0; }
.yc-sum dd { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 0; padding: 0; }
.yc-sum .yc-return dd { font-size: 20px; letter-spacing: -.02em; }
.yc-sum .yc-profit { padding-top: 14px; border-top: 1px dashed var(--ln2); margin-top: 2px; }
.yc-sum .yc-profit dt { color: var(--ink); font-weight: 700; }
.yc-sum .yc-profit dd { padding: 4px 12px; border-radius: 99px; background: var(--oks); color: var(--ok); font-size: 15px; font-weight: 800; }

.yc-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:16px;background:var(--grad);color:#fff;font-size:16px;font-weight:800;letter-spacing:.01em;box-shadow:0 10px 24px -8px rgba(30,91,240,.6);transition:all .15s ease}
.yc-cta:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.yc-cta:active:not(:disabled){transform:scale(.98)}
.yc-cta:disabled{opacity:.6;box-shadow:none;transform:none;cursor:not-allowed}
.yc-foot{display:grid;justify-items:center;gap:6px;margin-top:-4px;text-align:center}
.yc-note{font-size:11px;color:var(--i3)}
@container (max-width:340px){.yc-head{padding:14px}.yc-form{padding:14px;gap:18px}.yc-card{padding:12px;gap:12px}.yc-odds b{font-size:24px}.yc-amt{font-size:28px}.yc-cur{font-size:23px}}
@container (min-width:460px){.yc-head{padding:18px 20px 16px}.yc-form{padding:20px;gap:22px}.yc-card{padding:16px}.yc-odds b{font-size:32px}}

/* Rating Stars */
.stars { display: flex; justify-content: center; gap: 8px; font-size: 32px; cursor: pointer; color: var(--ln2); }
.stars .star { transition: color 0.2s; }
.stars .star.active { color: #facc15; }
</style>
</head>
<body>
<div id="banner-slot"></div>
<div id="app"><div style="display:flex;justify-content:center;align-items:center;height:100vh;color:var(--i2);font-weight:600;">Loading CricPulse...</div></div>
<div id="sh"></div>
<div class="tw" id="tw"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script> 
<script src="config.js"></script>
<script>
/* Match Details, Odds & Call Processing Logic */
function form(m,k) { return [0,1,2,3,4].map(i => (m.id*3+i*5+k*2)%7<4?"W":"L"); }

function matchV() {
  const m = mkt(S.mid);
  if (!m) return '<div class="card empty">Market not found or has ended.</div>';
  const lk = S.preds.find(p => String(p.m) === String(m.id));

  if (!lk && !S.slip[m.id]) {
    S.slip[m.id] = 'A';
    S.slipStake[m.id] = S.slipStake[m.id] || 50;
    save();
  }

  const sel = S.slip[m.id] || 'A';
  const cls = !left(m) || m.isFinished;
  const isTeamA = sel === 'A';
  const isTeamB = sel === 'B';
  const odds = isTeamA ? m.oa : m.ob;
  const currentStake = S.slipStake[m.id] || 50;
  const potential = Math.round(currentStake * odds);
  const profit = potential - currentStake;

  let callHtml = '';
  if (lk) {
    callHtml = `<div class="yc">
      <div style="align-items:center;text-align:center;padding:30px 18px;">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--oks);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">${ic("check",30)}</div>
        <h3 style="font-size:18px;font-weight:800;margin-bottom:4px;">Prediction Placed!</h3>
        <p class="mut s12" style="margin-bottom:16px;">Your pick is locked and being tracked.</p>
        <div class="yc-sum" style="text-align:left;">
          <div><dt>Your Pick</dt><dd>${esc(full(m,lk.p))}</dd></div>
          <div><dt>Stake</dt><dd>${inr(lk.stake)}</dd></div>
          <div><dt>Odds</dt><dd>${lk.odds}x</dd></div>
          <div class="yc-return"><dt>Potential Payout</dt><dd class="ok">${inr(lk.stake * lk.odds)}</dd></div>
        </div>
      </div>
    </div>`;
  } else if (m.isFinished) {
    callHtml = `<div class="empty" style="padding:30px 18px; text-align:center;"><b>Market has ended.</b><br><small>Predictions are closed.</small></div>`;
  } else {
    callHtml = `
      <section class="yc">
        <header class="yc-head">
          <div>
            <h3 class="yc-title">Your Call</h3>
            <p class="yc-sub">Pick a side and set your stake</p>
          </div>
          <div class="yc-badges">
            <span class="yc-live">LIVE</span>
            <span class="yc-timer">${ic("clock",13)} <span data-cd="${m.id}">${cdt(m)}</span></span>
          </div>
        </header>

        <form class="yc-form" onsubmit="return false">
          <fieldset class="yc-picks">
            <legend class="yc-label">Choose your team <small>Popularity</small></legend>
            <div class="yc-grid">
              <label class="yc-opt">
                <input type="radio" name="yc-side" value="A" ${isTeamA ? 'checked' : ''} onchange="selectSide('${m.id}', 'A')" ${cls ? 'disabled' : ''}>
                <span class="yc-card" style="--c1:#1a5cff;--c2:#1348d6">
                  <span class="yc-top">
                    <span class="yc-mono">${m.A[0].slice(0,2).toUpperCase()}</span>
                    <span class="yc-name">${m.A[1]}</span>
                    <span class="yc-check">${ic("check",14)}</span>
                  </span>
                  <span class="yc-odds"><b>${m.oa.toFixed(2)}x</b><span>winnings</span></span>
                </span>
              </label>

              <label class="yc-opt">
                <input type="radio" name="yc-side" value="B" ${isTeamB ? 'checked' : ''} onchange="selectSide('${m.id}', 'B')" ${cls ? 'disabled' : ''}>
                <span class="yc-card" style="--c1:#e0891a;--c2:#b86a0a">
                  <span class="yc-top">
                    <span class="yc-mono">${m.B[0].slice(0,2).toUpperCase()}</span>
                    <span class="yc-name">${m.B[1]}</span>
                    <span class="yc-check">${ic("check",14)}</span>
                  </span>
                  <span class="yc-odds"><b>${m.ob.toFixed(2)}x</b><span>winnings</span></span>
                </span>
              </label>
            </div>
          </fieldset>

          <div>
            <label class="yc-label" for="stake-input-${m.id}">Enter your stake <small>Min ₹10 · Max ₹10,000</small></label>
            <div class="yc-field">
              <span class="yc-cur">₹</span>
              <input class="yc-amt" id="stake-input-${m.id}" type="number" value="${currentStake}" oninput="updateStake('${m.id}', this.value)" ${cls ? 'disabled' : ''}>
            </div>
            <div class="yc-chips">
              <button type="button" class="yc-chip" onclick="incrementStake('${m.id}', 50)" ${cls ? 'disabled' : ''}>+₹50</button>
              <button type="button" class="yc-chip" onclick="incrementStake('${m.id}', 100)" ${cls ? 'disabled' : ''}>+₹100</button>
              <button type="button" class="yc-chip" onclick="incrementStake('${m.id}', 500)" ${cls ? 'disabled' : ''}>+₹500</button>
            </div>
          </div>

          <dl class="yc-sum">
            <div><dt>Your Stake</dt><dd id="yc-stake-${m.id}">${inr(currentStake)}</dd></div>
            <div class="yc-return"><dt>Total Return</dt><dd id="yc-return-${m.id}">${inr(potential)}</dd></div>
            <div class="yc-profit"><dt>Potential Profit</dt><dd id="yc-profit-${m.id}">+${inr(profit)}</dd></div>
          </dl>

          <button type="button" class="yc-cta" onclick="lockPicks(['${m.id}'])" ${cls ? 'disabled' : ''}>Confirm Bet</button>
          <p class="yc-foot"><span class="yc-note">Real money predictions. Instant UPI payouts.</span></p>
        </form>
      </section>
    `;
  }

  const op = wide() ? " open" : "";
  const det = [["Competition",m.lg],[m.q?"Resolution":"Venue",VEN[m.id] || "Online / Official Source"],["Closes in",`<span data-cd="${m.id}">${cdt(m)}</span>`],["Payout","Odds based"]];

  return `<div class="lay">
    <div class="c" style="width: 100%;">${callHtml}</div>
    <div class="d stack">
      <details class="card"${op}><summary>Match details${ic("chev",15)}</summary><div class="bd">${det.map(d => `<div class="ln"><span class="t2">${d[0]}</span><b>${d[1]}</b></div>`).join("")}</div></details>
      <details class="card"><summary>Rules and settlement${ic("chev",15)}</summary><div class="bd"><p>One pick per market. Official score settles all predictions. Voided markets refund original stakes.</p></div></details>
    </div>
  </div>`;
}

function homeV() {
  const t = tally();
  return `<div class="stack">${kpi([["Wallet Balance",inr(S.bal),"Available"],["Total Won",inr(S.txs.filter(x=>x.type==="win").reduce((a,b)=>a+b.amount,0)),"Lifetime"],["Total Picks",t.n,t.d+" settled"],["Win Rate",t.p+"%",t.w+" correct"]])}
  <div class="card" style="padding:12px 14px 2px"><h3>Featured Matches</h3>${MK.slice(0, 3).map(m => `<button class="ln" data-a="open" data-v="${m.id}"><div class="grow"><div class="nm">${esc(ttl(m))}</div><div class="mut s12">${m.lg} · Closes in ${cdt(m)}</div></div>${ic("chevR",16)}</button>`).join("")}</div>
  </div>`;
}

function picksV() {
  const L = S.preds.slice().reverse();
  return `<div class="card" style="padding:0 14px">${L.length ? L.map(p => {
    const m = mkt(p.m);
    if (!m) return '';
    return `<div class="ln"><div class="grow"><button class="nm" data-a="open" data-v="${m.id}">${esc(ttl(m))}</button><div class="mut s12">Pick: ${esc(full(m,p.p))} · Stake: ${inr(p.stake)}</div></div><div class="col" style="align-items:flex-end;">${stp(p)}</div></div>`;
  }).join("") : '<div class="empty">No picks logged.</div>'}</div>`;
}

function walletV() {
  const L = S.txs.slice().reverse();
  return `<div class="stack"><div class="wbal"><small>Wallet Balance</small><h2>${inr2(S.bal)}</h2><div class="row" style="margin-top:12px"><button class="btn" data-a="dep">${ic("down",14)} Add funds</button><button class="btn" data-a="wd">${ic("up",14)} Withdraw</button></div></div>
  <div class="card"><h3>Recent Transactions</h3>${L.length ? L.map(t => `<div class="ln"><div><b>${t.type}</b><div class="mut s12">${t.n || "-"} · ${t.date}</div></div><b class="${t.type=='withdraw'?'no':'ok'}">${t.type=='withdraw'?'-':'+'}${inr2(t.amount)}</b></div>`).join("") : '<div class="empty">No transactions recorded.</div>'}</div>
  </div>`;
}

function rewardsV() {
  return `<div class="card" style="padding:12px 14px 2px"><h3>Your coupons</h3>${S.cps.length ? S.cps.map((c,i) => `<div class="ln"><div class="cv">${esc(c.v)}</div><div class="grow"><b>${esc(c.t)}</b><div class="code"><span>${esc(c.code)}</span><button class="btn sm" data-a="copy" data-v="${esc(c.code)}">Copy</button></div></div></div>`).join("") : '<div class="empty">No coupons available.</div>'}</div>`;
}
function ranksV() { return `<div class="card"><div class="empty">Leaderboard updates weekly.</div></div>`; }
function alertsV() { return `<div class="card" style="padding:0;overflow:hidden">${ntf(S.nts)}</div>`; }

function profileV() {
  const u = S.user;
  const tg = [["em","Email updates","Weekly summary."],["re","Result alerts","When a pick settles."],["rw","Reward alerts","When a coupon unlocks."]];
  return `<div class="stack"><div class="card"><div class="row"><span class="av" style="width:46px;height:46px;font-size:18px">${esc(u.n[0].toUpperCase())}</span><div class="grow"><b>${esc(u.n)}</b><div class="mut s12">${esc(u.e)}</div></div></div></div>
<div class="card"><h3>Display name</h3><div class="row"><input class="inp" id="dn" value="${esc(u.n)}" maxlength="30"><button class="btn p" data-a="saven">Save</button></div></div>
<div class="card" style="padding:12px 14px 2px"><h3>Preferences</h3>${tg.map(([k,l,d]) => `<div class="ln"><div><b class="s12" style="display:block">${l}</b><span class="mut s12">${d}</span></div><label class="sw"><input type="checkbox" data-a="pref" data-v="${k}" ${S.pf[k]?"checked":""} aria-label="${l}"><i></i></label></div>`).join("")}<div class="ln"><b class="s12">Dark mode</b><label class="sw"><input type="checkbox" data-a="theme" ${isDark()?"checked":""} aria-label="Dark mode"><i></i></label></div></div>
<div class="grid2"><button class="btn" data-a="support">${ic("chat",15)} Support</button><button class="btn" data-a="logout">${ic("exit",15)} Log out</button></div></div>`;
}

function helpV() { return `<div class="stack">${faqH()}</div>`; }

function supportV() {
  return `<div class="stack"><div class="card"><div class="bt"><div><b>Support Center</b><div class="mut s12">We reply within 60 minutes</div></div><button class="btn p sm" data-a="newticket">Create Ticket</button></div></div>
  <div class="card">${S.tickets.length ? S.tickets.map(t => `<button class="ln" data-a="openticket" data-v="${t.id}"><div class="grow"><b>${esc(t.subject)}</b><div class="mut s12">${t.msgs.length} messages · ${t.status}</div></div><span class="pill ${t.status=='closed'?'':'ok'}">${t.status}</span></button>`).join("") : '<div class="empty">No support tickets found.</div>'}</div>
  </div>`;
}

function ticketV() {
  const t = S.tickets.find(x => x.id == S.ticketOpen);
  if (!t) return '<div class="card empty">Ticket not found.</div>';
  return `<div class="stack"><div class="card"><div class="bt"><b>${esc(t.subject)}</b><span class="pill">${t.status}</span></div></div>
  <div class="chat"><div class="msgs" id="msgs">${t.msgs.map(m => `<div class="msg ${m.me?'me':'them'}">${esc(m.text)}<small>${m.at}</small></div>`).join("")}</div>
  <div class="chatbar"><textarea id="ti" placeholder="Type reply..."></textarea><button class="ib" data-a="sendmsg">${ic("send",17)}</button></div></div>
  </div>`;
}

const VIEWS = {home:homeV, markets:marketsV, picks:picksV, wallet:walletV, rewards:rewardsV, ranks:ranksV, alerts:alertsV, profile:profileV, help:helpV, support:supportV, ticket:ticketV, match:matchV};

function shell() {
  if (S.cfg && S.cfg.maintenance_mode) {
    return `<div class="maint-block"><div class="maint-card"><h2>Maintenance Active</h2><p class="mut" style="margin-top:8px">CricPulse is currently paused for upgrades. We will be back shortly.</p></div></div>`;
  }

  const R = S.route, mt = R == "match", m = mt ? mkt(S.mid) : null;
  const title = mt ? ttl(m) : (META[R] ? META[R][0] : "CricPulse");
  const bn = [["home","Home","home"],["markets","Markets","target"],["picks","Picks","list"],["wallet","Wallet","wallet"],["profile","Profile","user"]];

  return `<div class="app"><aside class="rail"><div class="brand">${brand}</div>${RAIL.map(g => `<div class="rg">${g[0]}</div>` + g[1].map(i => `<button class="rl ${R==i[0]?'on':''}" data-a="nav" data-v="${i[0]}">${ic(i[2],16)}${i[1]}</button>`).join("")).join("")}</aside>
  <div><header class="top">${mt ? `<button class="ib" data-a="back">${ic("back",18)}</button>` : ''}<h1>${esc(title)}</h1><div class="grow"></div><button class="wc" data-a="nav" data-v="wallet">${ic("wallet",15)}${inr(S.bal)}</button></header>
  <main class="pg">${VIEWS[R]()}</main></div></div>
  <nav class="bn">${bn.map(i => `<button class="${R==i[0]?'on':''}" data-a="nav" data-v="${i[0]}">${ic(i[2],20)}${i[1]}</button>`).join("")}</nav>`;
}

function render() {
  const r = $("app");
  if (!S.user) {
    if (["terms","privacy","refund","about"].includes(S.pub)) r.innerHTML = legalPage(S.pub);
    else if (S.pub == "auth") r.innerHTML = authV();
    else r.innerHTML = landing();
  } else {
    r.innerHTML = shell();
  }
}

/* User interaction logic */
window.updateStake = function(id, val) {
  let num = parseFloat(val);
  if (isNaN(num) || num < 10) num = 10;
  S.slipStake[id] = num;
  save();

  const m = mkt(id);
  if (!m) return;
  const sel = S.slip[id] || 'A';
  const odds = sel == "A" ? m.oa : m.ob;
  const potential = Math.round(num * odds);
  const profit = potential - num;

  const lblStake = document.getElementById(`yc-stake-${id}`);
  const lblReturn = document.getElementById(`yc-return-${id}`);
  const lblProfit = document.getElementById(`yc-profit-${id}`);
  if (lblStake) lblStake.textContent = inr(num);
  if (lblReturn) lblReturn.textContent = inr(potential);
  if (lblProfit) lblProfit.textContent = '+' + inr(profit);
};

window.incrementStake = function(id, add) {
  let cur = S.slipStake[id] || 50;
  let next = Math.min(10000, cur + add);
  S.slipStake[id] = next;
  const inp = document.getElementById(`stake-input-${id}`);
  if (inp) inp.value = next;
  window.updateStake(id, next);
};

window.selectSide = function(id, side) {
  S.slip[id] = side;
  if (!S.slipStake[id]) S.slipStake[id] = 50;
  save();
  render();
};

function lockPicks(ids) {
  let total = 0;
  ids.forEach(id => { total += (S.slipStake[id] || 50); });
  if (S.bal < total) { toast("Insufficient wallet balance."); return; }

  S.bal -= total;
  addTx("stake", total, "Predictions locked", "completed");
  ids.forEach(id => {
    const m = mkt(id);
    const stake = S.slipStake[id] || 50;
    const odds = S.slip[id] == "A" ? m.oa : m.ob;
    S.preds.push({ id: Date.now() + Number(id), m: id, p: S.slip[id] || 'A', stake: stake, odds: odds, res: null });
    if (window.CP_DB && CP_DB.ready && S.user) {
      supabase.from('predictions').insert({ user_id: S.user.id, match_id: id, prediction_choice: S.slip[id] || 'A', amount: stake }).then();
    }
  });
  save();
  toast("Picks confirmed!");
  render();
}

/* Event Delegation */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  switch(a) {
    case "nav": S.route = v; render(); scrollTo(0,0); break;
    case "open": S.route = "match"; S.mid = v; render(); scrollTo(0,0); break;
    case "back": S.route = "markets"; render(); scrollTo(0,0); break;
    case "auth": S.pub = "auth"; S.au = v; render(); break;
    case "home0": S.pub = "land"; render(); break;
    case "page": S.pub = v; render(); break;
    case "subm": {
      const em = $("ae").value.trim(), pw = $("ap").value;
      if (!em || pw.length < 6) return;
      S.user = { id: uid(), n: em.split('@')[0], e: em };
      S.route = "home"; save(); render(); break;
    }
    case "gmail": {
      if (window.CP_DB && CP_DB.authClient) {
        CP_DB.authClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
      }
      break;
    }
    case "logout": S.user = null; S.pub = "land"; save(); render(); break;
    case "dep": sheet(`<h3>Add Funds</h3><div class="fld"><label>Amount (₹)</label><input class="inp" id="da" type="number" value="100"></div><button class="btn p w" data-a="depok">Deposit via UPI</button>`); break;
    case "depok": {
      const amt = Number($("da").value);
      if (amt < 10) return;
      S.bal += amt; addTx("deposit", amt, "Demo Deposit", "completed");
      save(); closeSheet(); toast("Funds added!"); render(); break;
    }
    case "wd": sheet(`<h3>Withdraw Funds</h3><div class="fld"><label>Amount (Min ₹100)</label><input class="inp" id="wa" type="number" value="${Math.min(S.bal, 100)}"></div><button class="btn p w" data-a="wdok">Submit</button>`); break;
    case "wdok": {
      const amt = Number($("wa").value);
      if (amt < 100 || amt > S.bal) return;
      S.bal -= amt; addTx("withdraw", amt, "Withdrawal Request", "pending");
      save(); closeSheet(); toast("Withdrawal processing."); render(); break;
    }
    case "pick": selectSide(v.split(":")[0], v.split(":")[1]); break;
    case "slipsheet": sheet(`<h3>Your Slip</h3>${slipBody()}`); break;
    case "lockslip": lockPicks(Object.keys(S.slip)); closeSheet(); break;
    case "newticket": {
      if (!S.user) return;
      const t = { id: uid(), subject: "Inquiry #" + uid(), status: "open", msgs: [{ me: true, text: "I need help with my balance.", at: "Just now" }] };
      S.tickets.unshift(t); S.ticketOpen = t.id; S.route = "ticket"; render(); break;
    }
    case "openticket": S.ticketOpen = v; S.route = "ticket"; render(); break;
    case "sendmsg": {
      const ta = $("ti"), t2 = S.tickets.find(x => x.id == S.ticketOpen);
      if (!ta || !t2 || !ta.value.trim()) return;
      t2.msgs.push({ me: true, text: ta.value.trim(), at: "Just now" });
      ta.value = ""; render(); break;
    }
  }
});

/* Realtime Sync */
window.addEventListener("load", async () => {
  render();
  if (window.supabase) {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.from("app_config").select("*").eq("id", "primary").single().then(res => {
      if (res.data) {
        S.cfg = res.data;
        if (res.data.banner_message) $("banner-slot").innerHTML = `<div class="banner-top">${esc(res.data.banner_message)}</div>`;
        render();
      }
    });

    sb.channel('global-sync')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_config' }, pl => {
        if (pl.new) {
          S.cfg = pl.new;
          if (pl.new.banner_message) $("banner-slot").innerHTML = `<div class="banner-top">${esc(pl.new.banner_message)}</div>`;
          else $("banner-slot").innerHTML = '';
          render();
        }
      })
      .subscribe();
  }
});
</script>
