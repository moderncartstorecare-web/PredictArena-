.yc{container-type:inline-size;position:relative;overflow:hidden;color:var(--ink);font-family:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:24px;box-shadow:0 4px 20px rgba(15,23,41,.05)}

.yc-title{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}

.yc-timer{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:var(--ams);color:var(--am);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.yc-form{display:grid;gap:20px;padding:20px}

.yc-label small{font-size:11.5px;font-weight:500;color:var(--i3)}
.yc-picks{min-width:0;border:0}
.yc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yc-opt{position:relative;display:block;min-width:0}
.yc-opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.yc-card{position:relative;display:flex;flex-direction:column;gap:14px;height:100%;padding:16px;border:2px solid var(--ln2);border-radius:20px;background:var(--sf);transition:all .2s cubic-bezier(.4,0,.2,1)}

/* User interaction logic */
window.updateStake = function(id, val) {
  let num = parseFloat(val);
  if (isNaN(num) || num < 10) num = 10;
  S.slipStake[id] = num;
  save();

  const m = mkt(id);
  if (!m) return;
  const sel = S.slip[id] || 'A';
  const odds = sel == "A" ? m.oa : m.ob;
  const potential = Math.round(num * odds);
  const profit = potential - num;

  const lblStake = document.getElementById(`yc-stake-${id}`);
  const lblReturn = document.getElementById(`yc-return-${id}`);
  const lblProfit = document.getElementById(`yc-profit-${id}`);
  if (lblStake) lblStake.textContent = inr(num);
  if (lblReturn) lblReturn.textContent = inr(potential);
  if (lblProfit) lblProfit.textContent = '+' + inr(profit);
};

window.incrementStake = function(id, add) {
  let cur = S.slipStake[id] || 50;
  let next = Math.min(10000, cur + add);
  S.slipStake[id] = next;
  const inp = document.getElementById(`stake-input-${id}`);
  if (inp) inp.value = next;
  window.updateStake(id, next);
};

window.selectSide = function(id, side) {
  S.slip[id] = side;
  if (!S.slipStake[id]) S.slipStake[id] = 50;
  save();
  render();
};

function lockPicks(ids) {
  let total = 0;
  ids.forEach(id => { total += (S.slipStake[id] || 50); });
  if (S.bal < total) { toast("Insufficient wallet balance."); return; }

  S.bal -= total;
  addTx("stake", total, "Predictions locked", "completed");
  ids.forEach(id => {
    const m = mkt(id);
    const stake = S.slipStake[id] || 50;
    const odds = S.slip[id] == "A" ? m.oa : m.ob;
    S.preds.push({ id: Date.now() + Number(id), m: id, p: S.slip[id] || 'A', stake: stake, odds: odds, res: null });
    if (window.CP_DB && CP_DB.ready && S.user) {
      supabase.from('predictions').insert({ user_id: S.user.id, match_id: id, prediction_choice: S.slip[id] || 'A', amount: stake }).then();
    }
  });
  save();
  toast("Picks confirmed!");
  render();
}

/* Event Delegation */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  switch(a) {
    case "nav": S.route = v; render(); scrollTo(0,0); break;
    case "open": S.route = "match"; S.mid = v; render(); scrollTo(0,0); break;
    case "back": S.route = "markets"; render(); scrollTo(0,0); break;
    case "auth": S.pub = "auth"; S.au = v; render(); break;
    case "home0": S.pub = "land"; render(); break;
    case "page": S.pub = v; render(); break;
    case "subm": {
      const em = $("ae").value.trim(), pw = $("ap").value;
      if (!em || pw.length < 6) return;
      S.user = { id: uid(), n: em.split('@')[0], e: em };
      S.route = "home"; save(); render(); break;
    }
    case "gmail": {
      if (window.CP_DB && CP_DB.authClient) {
        CP_DB.authClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
      }
      break;
    }
    case "logout": S.user = null; S.pub = "land"; save(); render(); break;
    case "dep": sheet(`<h3>Add Funds</h3><div class="fld"><label>Amount (₹)</label><input class="inp" id="da" type="number" value="100"></div><button class="btn p w" data-a="depok">Deposit via UPI</button>`); break;
    case "depok": {
      const amt = Number($("da").value);
      if (amt < 10) return;
      S.bal += amt; addTx("deposit", amt, "Demo Deposit", "completed");
      save(); closeSheet(); toast("Funds added!"); render(); break;
    }
    case "wd": sheet(`<h3>Withdraw Funds</h3><div class="fld"><label>Amount (Min ₹100)</label><input class="inp" id="wa" type="number" value="${Math.min(S.bal, 100)}"></div><button class="btn p w" data-a="wdok">Submit</button>`); break;
    case "wdok": {
      const amt = Number($("wa").value);
      if (amt < 100 || amt > S.bal) return;
      S.bal -= amt; addTx("withdraw", amt, "Withdrawal Request", "pending");
      save(); closeSheet(); toast("Withdrawal processing."); render(); break;
    }
    case "pick": selectSide(v.split(":")[0], v.split(":")[1]); break;
    case "slipsheet": sheet(`<h3>Your Slip</h3>${slipBody()}`); break;
    case "lockslip": lockPicks(Object.keys(S.slip)); closeSheet(); break;
    case "newticket": {
      if (!S.user) return;
      const t = { id: uid(), subject: "Inquiry #" + uid(), status: "open", msgs: [{ me: true, text: "I need help with my balance.", at: "Just now" }] };
      S.tickets.unshift(t); S.ticketOpen = t.id; S.route = "ticket"; render(); break;
    }
    case "openticket": S.ticketOpen = v; S.route = "ticket"; render(); break;
    case "sendmsg": {
      const ta = $("ti"), t2 = S.tickets.find(x => x.id == S.ticketOpen);
      if (!ta || !t2 || !ta.value.trim()) return;
      t2.msgs.push({ me: true, text: ta.value.trim(), at: "Just now" });
      ta.value = ""; render(); break;
    }
  }
});

/* Realtime Sync */
window.addEventListener("load", async () => {
  render();
  if (window.supabase) {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.from("app_config").select("*").eq("id", "primary").single().then(res => {
      if (res.data) {
        S.cfg = res.data;
        if (res.data.banner_message) $("banner-slot").innerHTML = `<div class="banner-top">${esc(res.data.banner_message)}</div>`;
        render();
      }
    });

    sb.channel('global-sync')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_config' }, pl => {
        if (pl.new) {
          S.cfg = pl.new;
          if (pl.new.banner_message) $("banner-slot").innerHTML = `<div class="banner-top">${esc(pl.new.banner_message)}</div>`;
          else $("banner-slot").innerHTML = '';
          render();
        }
      })
      .subscribe();
  }
});
</script>
