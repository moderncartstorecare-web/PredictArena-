}

function liveBoard(m) {
  const L = LV[m.id], lg = `<div class="lg">${L.lg.map(x => `<div>${esc(x)}</div>`).join("")}</div>`;

  }
  let a,as,b,bs,ex;
  if (m.c == "cricket") { a = L.r+"/"+L.w; as = ov(L.b)+" ov"; b = "-"; bs = "Yet to bat"; ex = m.A[1]+" batting, target "+L.tg; }
  else if (m.c == "football") { a = L.g[0]; as = ""; b = L.g[1]; bs = ""; ex = L.n+"' played"; }
  else if (m.c == "kabaddi") { a = L.p[0]; as = ""; b = L.p[1]; bs = ""; ex = L.n+" of 40 minutes"; }
  else { a = L.rd[0]; as = "rounds"; b = L.rd[1]; bs = "rounds"; ex = "Map 2, first to 13"; }
  return `<div class="sg"><div class="tm"><b>${esc(m.A[1])}</b><span>${a}</span><small>${as}</small></div><div class="mut s12">vs</div><div class="tm"><b>${esc(m.B[1])}</b><span>${b}</span><small>${bs}</small></div></div><div class="ex">${ex}</div>${lg}`;
}

function tick() {
  MK.forEach(m => {
    const L = LV[m.id], r = Math.random(), A = m.A[0], B = m.B[0];
    if (m.c == "cricket") {
      if (L.b >= 119) return;
      const o = [0,0,1,1,1,2,4,4,6,-1][Math.floor(r*10)];
      L.b++;
      if (o < 0) { if (L.w < 9) L.w++; L.lg.unshift(ov(L.b)+" ov: WICKET"); }
      else { L.r += o; L.lg.unshift(ov(L.b)+" ov: "+(o==4?"FOUR":o==6?"SIX":o?o+" run"+(o>1?"s":""):"Dot ball")); }
    } else if (m.c == "football") {
      if (L.n >= 90) return; L.n++;
      if (r < .05) { const k = Math.random()*100 < m.w ? 0 : 1; L.g[k]++; L.lg.unshift(L.n+"' GOAL, "+(k?B:A)); }
      else if (r < .12) L.lg.unshift(L.n+"' Corner, "+(r<.08?A:B));
    } else if (m.c == "kabaddi") {
      if (L.n >= 40) return; if (r < .5) L.n++;
      const k = r < .5 ? 0 : 1, p = 1+Math.floor(Math.random()*3);
      L.p[k] += p; L.lg.unshift("Raid: "+(k?B:A)+" +"+p);
    } else if (m.c == "esports") {
      if (L.rd[0] >= 13 || L.rd[1] >= 13) return;
      const k = r < m.w/100 ? 0 : 1; L.rd[k]++; L.lg.unshift("Round won by "+(k?B:A));
    } else {
      L.v += m.id==7 ? Math.random()*1.4 : (Math.random()-.45)*45;
      L.lg.unshift("Update: "+(m.id==7?"₹"+L.v.toFixed(1)+" cr":ni(L.v)));
    }
    L.lg = L.lg.slice(0,5);
  });
  document.querySelectorAll("[data-lb]").forEach(n => n.innerHTML = liveBoard(mkt(n.dataset.lb)));
  document.querySelectorAll("[data-lt]").forEach(n => n.textContent = liveText(mkt(n.dataset.lt)));
  document.querySelectorAll("[data-mini]").forEach(n => n.innerHTML = miniBoard());
}

/* actions */
function enter(u) {
  u.n = (u.n||"").replace(/[<>"&]/g,"").trim().slice(0,30) || "Player";
  u.e = (u.e||"").replace(/[<>"&]/g,"");
  if (S.user === null && S.le && S.le != u.e) { Object.assign(S,{bal:0,xp:0,st:0,best:0,preds:[],cps:[],txs:[],slip:{}}); }
  S.le = u.e; S.user = u; S.route = "home"; S.pop = 0; save(); render(); scrollTo(0,0);
}

function lockPicks(ids) {
  const ok = ids.filter(id => left(mkt(id)) > 0);
  if (ok.length < ids.length) toast("Closed markets were skipped.","clock");
  if (!ok.length) { render(); return; }
  ok.forEach(id => { S.preds.push({id:Date.now()+Number(id), m:Number(id), p:S.slip[id], res:null, pay:0}); delete S.slip[id]; });
  S.xp += ok.length*10; note(ok.length+" pick"+(ok.length>1?"s":"")+" locked", "+"+ok.length*10+" XP. Results appear in My picks.","lock");
  save(); closeSheet(); toast("Locked "+ok.length+" pick"+(ok.length>1?"s":"")+". +"+ok.length*10+" XP","lock"); render();
}

function settle(id) {
  const p = S.preds.find(x => x.id == id); if (!p || p.res) return;
  const m = mkt(p.m), win = Math.random()*100 < (p.p=="A"?m.w:100-m.w); let c = null;
  if (win) {
    p.res = "w"; S.st++; S.best = Math.max(S.best,S.st); S.xp += 50; p.pay = Math.round(10*(p.p=="A"?m.oa:m.ob)); S.bal += p.pay; addTx("win",p.pay,ttl(m),"completed");
    const q = RW[Math.floor(Math.random()*RW.length)]; c = {v:q[0],t:q[1],code:q[2],cat:q[3],cl:0}; S.cps.push(c);
    note("Pick correct", ttl(m)+". "+inr(p.pay)+" added and a reward unlocked.","award");
  } else { p.res = "l"; S.st = 0; S.xp += 5; note("Pick incorrect", ttl(m)+". You earned 5 XP.","x"); }
  save(); render();
  sheet(`<h3 style="font-size:17px;margin-bottom:6px">${win?"Pick correct":"Pick incorrect"}</h3><p class="t2" style="margin-bottom:16px">${win?"You earned 50 XP and "+inr(p.pay)+" funds, and unlocked: <b>"+esc(c.t)+"</b>.":"You earned 5 XP for taking part. Try another market."}</p><button class="btn p w" data-a="sgo" data-v="${win?"rewards":"markets"}">${win?"Go to coupons":"Back to markets"}</button>`);
}

const mask = s => s.length <= 4 ? "••••" : s.slice(0,2) + "••••" + s.slice(-2);
const depSheet = () => sheet(`<h3 style="font-size:17px">Add funds</h3><p class="mut s12" style="margin:2px 0 12px">Funds are added instantly.</p><div class="chips" style="margin:0 0 10px;padding:0">${[100,500,1000,2000].map(v => `<button class="chip" data-a="damt" data-v="${v}">₹${v}</button>`).join("")}</div><div class="fld"><label for="da">Amount</label><input class="inp" id="da" type="number" inputmode="numeric" min="10" placeholder="Enter amount"></div><div class="fld"><label for="dm">Method</label><select class="inp" id="dm"><option>UPI</option><option>Card</option><option>Net banking</option></select></div><div class="err" id="er"></div><button class="btn p w" data-a="depok">Add funds</button>`);
const wdSheet = () => sheet(`<h3 style="font-size:17px">Withdraw</h3><p class="mut s12" style="margin:2px 0 12px">Available: <b class="ok">${inr2(S.bal)}</b></p><div class="fld"><label for="wa">Amount (min ₹100)</label><div class="row"><input class="inp" id="wa" type="number" inputmode="numeric" placeholder="Enter amount"><button class="btn" data-a="wmax">Max</button></div></div><div class="fld"><label for="wt">Destination (Bank / UPI ID)</label><input class="inp" id="wt" maxlength="30" placeholder="e.g. yourname@upi"></div><div class="err" id="er"></div><button class="btn p w" data-a="wdok">Request withdrawal</button>`);
const moreSheet = () => sheet(`<h3 style="font-size:17px;margin-bottom:10px">More</h3><div class="tiles">${[["rewards","Coupons","gift"],["ranks","Leaderboard","award"],["alerts","Notifications","bell"],["profile","Profile","user"],["help","Help and terms","help"]].map(([r,l,g]) => `<button class="tile" data-a="nav" data-v="${r}">${ic(g,18)}${l}</button>`).join("")}<button class="tile" data-a="theme">${ic(isDark()?"sun":"moon",18)}${isDark()?"Light mode":"Dark mode"}</button><button class="tile" data-a="logout">${ic("exit",18)}Log out</button></div>`);

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t) {
    if (S.pop && !e.target.closest(".pp")) { S.pop = 0; render(); }
    if (e.target.classList.contains("ov")) closeSheet();
    return;
  }
  const a = t.dataset.a, v = t.dataset.v;
  if (S.pop && a != "pop" && !e.target.closest(".pp")) S.pop = 0;
  
  switch(a) {
    case "nav": S.route = v; S.pop = 0; closeSheet(); render(); scrollTo(0,0); break;
    case "sgo": closeSheet(); S.route = v; render(); scrollTo(0,0); break;
    case "auth": S.pub = "auth"; S.au = v; render(); break;
    case "home0": S.pub = "land"; render(); break;
    case "guest": enter({n:"Guest User", e:"guest@cricpulse.com"}); break;
    case "subm": {
      const em = $("ae").value.trim(), pw = $("ap").value, fn = $("an") ? $("an").value.trim() : "", er = $("er");
      if (S.au == "up" && !fn) { er.textContent = "Enter your full name."; return; }
      if (!/^\S+@\S+\.\S+$/.test(em)) { er.textContent = "Enter a valid email address."; return; }
      if (pw.length < 6) { er.textContent = "Password must be at least 6 characters."; return; }
      enter({n:fn||em.split("@")[0], e:em}); break;
    }
    case "theme": S.theme = isDark() ? "light" : "dark"; applyTheme(); save(); closeSheet(); render(); break;
    case "more": moreSheet(); break;
    case "pop": S.pop = S.pop ? 0 : 1; render(); break;
    case "readall": S.nts.forEach(n => n.r = 1); save(); render(); break;
    case "cat": S.cat = v; render(); break;
    case "pick": case "mpick": {
      const [id,k] = v.split(":");
      if (left(mkt(id)) <= 0) { toast("This market has closed.","clock"); return; }
      if (a == "pick" && S.slip[id] == k) delete S.slip[id]; else S.slip[id] = k;
      render(); break;
    }
    case "rm": delete S.slip[v]; render(); if (!Object.keys(S.slip).length) closeSheet(); else slipSheet(); break;
    case "slipsheet": slipSheet(); break;
    case "lockslip": lockPicks(Object.keys(S.slip)); break;
    case "lockm": lockPicks([v]); break;
    case "open": S.route = "match"; S.mid = Number(v); S.pop = 0; render(); scrollTo(0,0); break;
    case "pff": S.pff = v; render(); break;
    case "nf": S.nf = v; render(); break;
    case "rk": S.rk = v; render(); break;
    case "txf": S.txf = v; render(); break;
    case "settle": settle(v); break;
    case "claim": {
      const c = S.cps[Number(v)]; if (!c || c.cl) return;
      c.cl = 1; S.xp += 20; note("Reward claimed", c.t+". Code: "+c.code, "gift"); save(); toast("Reward claimed. Code ready.","gift"); render(); break;
    }
    case "copy": try{navigator.clipboard.writeText(v)}catch(x){} toast("Code "+v+" copied","copy"); break;
    case "chk": S.chk = new Date().toDateString(); S.xp += 10; note("Daily check-in","+10 XP","star"); save(); toast("Checked in. +10 XP","star"); render(); break;
    case "pref": S.pf[v] = t.checked ? 1 : 0; save(); break;
    case "saven": {
      const n = $("dn").value.replace(/[<>"&]/g,"").trim();
      if (!n) { toast("Name cannot be empty.","x"); return; }
      S.user.n = n; save(); toast("Profile updated.","user"); render(); break;
    }
    case "pw": if(!$("p1").value || $("p2").value.length<6){toast("Enter current and new password (6+ characters).","x");return} $("p1").value=$("p2").value=""; toast("Password updated.","shield"); break;
    case "logout": S.user = null; S.pub = "land"; S.pop = 0; closeSheet(); save(); render(); scrollTo(0,0); break;
    case "reset": Object.assign(S,{bal:0,xp:0,st:0,best:0,preds:[],cps:[],txs:[],slip:{},chk:""}); save(); toast("Data reset."); render(); break;
    case "dep": depSheet(); break;
    case "damt": $("da").value = v; break;
    case "depok": {
      const x = Number($("da").value);
      if (!x || x < 10) { $("er").textContent = "Minimum deposit is ₹10."; return; }
      if (x > 100000) { $("er").textContent = "Maximum deposit is ₹1,00,000."; return; }
      S.bal += x; addTx("deposit",x,"Deposit via "+$("dm").value,"completed"); note("Funds added",inr2(x)+" added to your wallet.","wallet"); save(); closeSheet(); toast(inr2(x)+" added.","wallet"); render(); break;
    }
    case "wd": if(S.bal < 100){toast("Minimum withdrawal is ₹100.","x"); return;} wdSheet(); break;
    case "wmax": $("wa").value = Math.floor(S.bal); break;
    case "wdok": {
      const x = Number($("wa").value), d = $("wt").value.trim(), er = $("er");
      if (!x || x < 100) { er.textContent = "Minimum withdrawal is ₹100."; return; }
      if (x > S.bal) { er.textContent = "Amount exceeds your balance."; return; }
      if (!d) { er.textContent = "Enter a destination."; return; }
      S.bal -= x; addTx("withdraw",x,"To "+mask(d),"pending"); note("Withdrawal requested",inr2(x)+" is being processed.","wallet"); save(); closeSheet(); toast("Withdrawal requested.","wallet"); render(); break;
    }
    case "wcancel": {
      const x = S.txs[Number(v)]; if (!x || x.status != "pending") return;
      x.status = "cancelled"; S.bal += x.amount; note("Withdrawal cancelled",inr2(x.amount)+" returned to your wallet.","x"); save(); toast("Withdrawal cancelled.","x"); render(); break;
    }
  }
});

function slipSheet() { sheet(`<h3 style="font-size:17px;margin-bottom:6px">Your slip</h3>${slipBody()}`); }

document.addEventListener("input", e => { if (e.target.id == "q") { S.q = e.target.value; $("ml").innerHTML = mlist(); } });
document.addEventListener("keydown", e => {
  if (e.key == "Escape") closeSheet();
  if (e.key == "Enter" && ["ae","ap","an"].includes(e.target.id)) { const b = document.querySelector('[data-a="subm"]'); if (b) b.click(); }
});

applyTheme();
render();
</script>
</body>
</html>
