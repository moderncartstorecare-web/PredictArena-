cp:[{n:"Coffee Voucher",code:"CAFE100",dc:"₹100 off",used:312,tot:500,on:1},{n:"Shopping Coupon",code:"SHOP15",dc:"15% off",used:140,tot:300,on:1},{n:"Premium Month",code:"PREM30",dc:"30 days free",used:48,tot:100,on:1},{n:"Free Entry Pass",code:"VIPFREE",dc:"Zero-fee contest",used:12,tot:50,on:0}],

var D1=JSON.stringify(D0),S=JSON.parse(D1);try{var sv=localStorage.getItem("pxa1");if(sv){var o0=JSON.parse(sv);LOCAL_KEYS.forEach(function(k){if(o0[k]!==undefined)S[k]=o0[k]})}}catch(e){}

function $(i){return document.getElementById(i)}
function ic(n){return '<i data-lucide="'+n+'"></i>'}
function num(n){return n.toLocaleString("en-IN")}
function fm(n){return "₹"+num(n)}
function mk(n){return '<span class="mk'+(EYE?"":" bl")+'">'+(EYE?fm(n):"₹ 00,00,000")+'</span>'}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ini(n){return n.split(" ").map(function(w){return w[0]}).join("").slice(0,2).toUpperCase()}
function U(i){return S.users.filter(function(u){return u.id===i})[0]||{id:i,name:"Unknown user",email:"",city:"",wal:0,pts:0,st:"active",joined:"",kyc:0,ghost:1}}
function MM(i){return S.matches.filter(function(m){return m.id==i})[0]}
function TK(i){return S.tickets.filter(function(t){return t.id===i})[0]}
function WDR(i){return S.wd.filter(function(w){return w.id===i})[0]}
function now(){return new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})}
function act(t){S.act.unshift([t,now()]);S.act=S.act.slice(0,12)}
function toast(t,k){var e=document.createElement("div");e.className="toast";e.innerHTML=ic(k||"circle-check")+esc(t);document.body.appendChild(e);try{lucide.createIcons()}catch(x){}setTimeout(function(){e.remove()},2800)}
function rnd(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var MC={};function MD(i){if(i>5)i=5;if(MC[i])return MC[i];var r=rnd(77+i*13),d=[],t=0;for(var k=0;k<DD[i];k++){var v=Math.round(15500-i*650+r()*9000+Math.sin(k/3)*1800);d.push(v);t+=v}
  return MC[i]={d:d,t:t,nu:Math.round(780+r()*620),pr:Math.round(14000+r()*8000),po:Math.round(t*.38),wp:Math.round(t*.22)}}
function chg(){var c=MD(S.mi).t,p=S.mi<5?MD(S.mi+1).t:c*.93;return Math.round((c-p)/p*1000)/10}
function chart(a){var n=a.length,mx=Math.max.apply(null,a),w=700/n,s='<svg viewBox="0 0 700 190" width="100%" role="img" aria-label="Daily earnings">';a.forEach(function(v,i){var h=v/mx*148;s+='<rect x="'+(i*w+w*.15)+'" y="'+(158-h)+'" width="'+w*.7+'" height="'+h+'" rx="2" style="fill:var(--pr);opacity:.85">'+(EYE?'<title>Day '+(i+1)+': '+fm(v)+'</title>':'')+'</rect>';if(i===0||(i+1)%5===0)s+='<text x="'+(i*w+w/2)+'" y="178" font-size="10" text-anchor="middle" style="fill:var(--mu)">'+(i+1)+'</text>'});return s+'</svg>'}
function pendW(){return S.wd.filter(function(w){return w.st==="pending"})}
function chipM(s){return '<span class="chip '+({live:"no",upcoming:"",closed:"wa",settled:"ok"}[s])+'">'+s[0].toUpperCase()+s.slice(1)+'</span>'}
function TU(){return S.ucount||S.users.length}
function AU(){return S.users.filter(function(u){return u.st==="active"}).length}
function openTk(){return S.tickets.filter(function(t){return t.st!=="closed"}).length}
function tkUser(t){var u=S.users.filter(function(x){return x.id===t.uid})[0];return u?u.name:(t.nm||("User "+String(t.uid).slice(0,6)))}
function P(k,v){var o={};o[k]=v;return o}
/* ---------- Supabase: mapping ---------- */
function fd(v,y){if(!v)return "";var d=new Date(v);if(isNaN(d))return String(v);return d.toLocaleDateString("en-IN",y?{day:"2-digit",month:"short",year:"numeric"}:{day:"2-digit",month:"short"})}
function fdt(v){if(!v)return "";var d=new Date(v);if(isNaN(d))return String(v);return d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"})}
function normSt(v){v=String(v==null?"active":v).toLowerCase();return(v==="blocked"||v==="banned"||v==="suspended")?"blocked":"active"}
function normWd(v){v=String(v==null?"pending":v).toLowerCase();return(v==="approved"||v==="completed"||v==="paid"||v==="success")?"approved":(v==="rejected"||v==="declined"||v==="failed"||v==="cancelled")?"rejected":"pending"}
function normTk(v){v=String(v==null?"open":v).toLowerCase();return(v==="closed"||v==="resolved"||v==="done")?"closed":v==="pending"||v==="answered"?"pending":"open"}
function mapUser(r){var c=COLS.users;return{
  id:String(r[c.id]),
  name:r[c.name]||r.full_name||r[c.email]||"User",
  email:r[c.email]||"",
  city:r[c.city]||"",
  /* wallet balance: reads the attached wallet row (object or array), falls back to the users column */
  wal:Number((r.wallet&&(Array.isArray(r.wallet)?(r.wallet[0]||{}).balance:r.wallet.balance))||r[c.wallet]||0),
  pts:Number(r[c.points]||0),
  st:normSt(r[c.status]),
  joined:fd(r[c.created],1),
  kyc:(r[c.kyc]===true||r[c.kyc]===1||r[c.kyc]==="verified")?1:0
}}
function mapWd(r){var c=COLS.wd;return{id:String(r[c.id]),uid:String(r[c.user]==null?"":r[c.user]),amt:Number(r[c.amount]||0),m:r[c.method]||"UPI",ac:r[c.account]||"",d:fd(r[c.created]),st:normWd(r[c.status])}}
function mapTk(r){var c=COLS.tk;return{id:String(r[c.id]),uid:String(r[c.user]==null?"":r[c.user]),nm:r.user_name||r.name||r.email||"",sub:r[c.subject]||"(no subject)",st:normTk(r[c.status]),pr:String(r[c.priority]||"normal").toLowerCase(),d:fd(r[c.created]),msgs:null}}
function rebuildTx(){S.tx=S.txl.concat(S.wd.filter(function(w){return w.st!=="rejected"}).map(function(w){return{uid:w.uid,ty:"Withdrawal",amt:"-"+w.amt,n:"Request "+w.id.slice(0,8),d:w.d}}))}
/* ---------- Supabase: data ---------- */
async function fetchT(t,oc,lim,cnt){var q=function(o){var x=db.from(t).select("*",cnt?{count:"exact"}:{});if(o&&oc)x=x.order(oc,{ascending:false});return x.limit(lim)};var r=await q(true);if(r.error)r=await q(false);return r}
async function loadAll(){
  if(!db)return;
  try{
    var r=await Promise.all([
       
      fetchT("users",COLS.users.created,500,1), /* users */
      fetchT("wallet",null,500,0),              /* wallets */
      fetchT("withdrawal_requests",COLS.wd.created,300),
      fetchT("notifications","created_at",100) // <-- ADD THIS
      fetchT("support_tickets",COLS.tk.created,300),
      fetchT("matches","created_at",500)        /* <-- ADD THIS LINE */
    ]);
    var names=["users","wallet","withdrawal_requests","support_tickets"],er=[];
    r.forEach(function(x,i){if(x.error && i!==1)er.push(names[i]+": "+x.error.message)}); /* ignore error for wallet if empty */
    if(er.length)toast("Could not load "+er[0],"circle-alert");

    if(!r[0].error){
      var usersData = r[0].data || [];
      var walletData = (r[1] && r[1].data) ? r[1].data : [];

      /* attach wallet balance to each user object */
      usersData.forEach(function(u){
        var w = walletData.find(function(x){return x.user_id === u.id});
        if(w) u.wallet = w;
      });

      S.users=usersData.map(mapUser);
      S.ucount=r[0].count||S.users.length;
    }

    if(!r[2].error)S.wd=(r[2].data||[]).map(mapWd);
    if(!r[3].error)S.tickets=(r[3].data||[]).map(mapTk);
    
    /* <-- ADD THIS BLOCK FOR MATCHES */
    if(!r[4].error){
      S.matches=(r[4].data||[]).map(function(x){
        return {
          id:x.id,
          c:x.category,
          l:x.league,
          a:x.team_a,
          b:x.team_b,
          when:x.closes_at ? new Date(x.closes_at).toLocaleString("en-IN", {day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"}) : "",
          st: (x.closes_at && new Date(x.closes_at) < new Date()) ? "closed" : "upcoming",
          win:null,
          pa:x.crowd_a||50,
          n:0
        };
      });
    }
  }catch(e){toast("Network error while loading data","circle-alert")}
  rebuildTx();render()}
async function upd(table,idcol,id,patch){if(!db){toast("Supabase is not configured","circle-alert");return false}var r=await db.from(table).update(patch).eq(idcol,id).select();if(r.error){toast("Update failed: "+r.error.message,"circle-alert");return false}if(!r.data||!r.data.length){toast("Nothing was updated. Check your RLS policies.","circle-alert");return false}return true}
async function doBlock(id){var u=S.users.filter(function(x){return x.id===id})[0];if(!u){toast("User not found","circle-alert");return}var ns=u.st==="active"?"blocked":"active";if(!(await upd("users",COLS.users.id,u.id,P(COLS.users.status,ns))))return;u.st=ns;act((ns==="blocked"?"Blocked ":"Unblocked ")+u.name);toast(u.name+" "+ns);save();render()}
async function doWd(id,st){var w=WDR(id);if(!w)return;if(!(await upd("withdrawal_requests",COLS.wd.id,w.id,P(COLS.wd.status,st))))return;w.st=st;var u=S.users.filter(function(x){return x.id===w.uid})[0];
  if(st==="rejected"&&REFUND_ON_REJECT&&u){var nw=u.wal+w.amt;if(await upd("users",COLS.users.id,u.id,P(COLS.users.wallet,nw))){u.wal=nw;S.txl.unshift({uid:u.id,ty:"Refund",amt:"+"+w.amt,n:"Rejected "+w.id.slice(0,8),d:fd(new Date())})}}
  act("Withdrawal "+w.id.slice(0,8)+" "+st+" ("+(u?u.name:"unknown user")+")");toast("Withdrawal "+st);rebuildTx();save();render()}
async function doWallet(uid,a,cr,why){
  var u=S.users.filter(function(x){return x.id===uid})[0];
  if(!u){toast("User not found","circle-alert");return}
  if(!(a>0)){toast("Enter an amount above zero","circle-alert");return}
  if(!cr&&a>u.wal){toast("Amount exceeds wallet balance","circle-alert");return}
  
  var nw=u.wal+(cr?a:-a);
  
  // Fix: Update the separate 'wallet' table instead of the 'users' table
  var r = await db.from("wallet").update({ balance: nw }).eq("user_id", u.id);
  if(r.error){toast("Update failed: "+r.error.message,"circle-alert");return}
  
  u.wal=nw;
  S.txl.unshift({uid:u.id,ty:cr?"Credit":"Debit",amt:(cr?"+":"-")+a,n:why,d:fd(new Date())});
  act((cr?"Credited ":"Debited ")+fm(a)+" "+(cr?"to ":"from ")+u.name);
  closeM();toast("Wallet updated");rebuildTx();save();render();
}

/* Always return to the clean page URL (no old #access_token or ?code leftovers) */
function authRedirect(){return location.origin+location.pathname}
function cleanUrl(){if(/access_token|code=|error/.test(location.hash+location.search))history.replaceState(null,"",location.pathname)}
async function doLogin(){
  if(!db){toast("Supabase is not configured","circle-alert");return}
  
  // Check if a non-admin is already logged in via Supabase and kick them out immediately
  var check = await db.auth.getSession();
  if(check.data && check.data.session){
      var em = check.data.session.user.email;
      if(ADMIN_EMAILS.length && ADMIN_EMAILS.map(function(x){return x.toLowerCase()}).indexOf(em.toLowerCase()) < 0){
          toast("This Google account is not an admin. Logging out...","circle-alert");
          await db.auth.signOut();
          return;
      }
  }
  
  toast("Opening Google sign in…","log-in");
  var r=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:authRedirect(),queryParams:{prompt:"select_account"}}});
  if(r.error)toast("Sign in failed: "+r.error.message,"circle-alert");
}
async function doLogout(){
  try{if(db)await db.auth.signOut()}catch(e){}
  LOGIN=0;
  history.replaceState(null,"",location.pathname);
  location.reload();
}

document.addEventListener("change",function(e){var t=e.target;if(t.dataset.sel==="month"){S.mi=+t.value;save();render()}else if(t.dataset.sel==="tf"){TF=t.value;render()}else if(t.dataset.cp){CPS[t.dataset.cp]=t.value;if(t.dataset.cp==="aud"||t.dataset.cp==="uid")render()}});
document.addEventListener("submit",function(e){e.preventDefault();var id=e.target.id;
  if(id==="lf"){doLogin();return}
  else if(id==="tf"){sendReply();return}
  else if(id==="mf"){
    // 1. Save to Supabase
    var newMatch = {
      category: $("mc").value.toLowerCase(),
      league: $("ml").value,
      team_a: $("ma").value,
      team_b: $("mb").value,
      closes_at: new Date(Date.now() + 86400000).toISOString(), // Closes in 24 hours
      crowd_a: 50,
      odds_a: 1.85,
      odds_b: 2.10
    };
    
    db.from('matches').insert(newMatch).then(function(res) {
      if (res.error) {
         toast("Error saving match: " + res.error.message, "circle-alert");
         return;
      }
      toast("Match published to website!");
      closeM();
      // Reload data to show the new match
      loadAll(); 
    });
  }
  else if(id==="sw"){var m=MM(MOD),w=document.querySelector("input[name=w]:checked");if(!w)return;m.win=w.value;m.st="settled";var n=Math.round(m.n*(w.value==="void"?0:(w.value==="a"?m.pa:100-m.pa))/100);act("Match settled: "+m.a+" vs "+m.b+" ("+(w.value==="void"?"void, refunds issued":n+" winners rewarded")+")");S.sent.unshift({t:"Result declared",m:m.a+" vs "+m.b+" has been settled.",aud:"Participants",ty:"Result",time:now(),r:m.n});closeM();toast("Winner saved. Participants notified")}
  else if(id==="wf"){doWallet(MOD,+$("wa").value,$("wt").value==="c",$("wr").value);return}
  else if(id==="cf"){S.cp.push({n:$("cn").value,code:$("cc").value.toUpperCase(),dc:$("cd").value,used:0,tot:+$("ct").value,on:1});closeM();toast("Coupon created")}
    else if(id==="nf"){
    if(!CPS.t||!CPS.m){toast("Add a title and message","circle-alert");return}
    
    // Figure out if we are sending to everyone or one specific user
    var targetUser = (CPS.aud === "one") ? CPS.uid : null; 
    
    db.from('notifications').insert({
      title: CPS.t,
      body: CPS.m,
      icon: CPS.ty === 'Alert' ? 'alert' : 'bell',
      user_id: targetUser
    }).then(function(res) {
      if (res.error) {
         toast("Error sending: " + res.error.message, "circle-alert");
         return;
      }
      toast("Notification sent!");
      CPS.t=""; CPS.m="";
      render();
    });
  }
save();render()});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-p],[data-a],[data-win],[data-cl],[data-dm],[data-uv],[data-un],[data-uw],[data-ub],[data-wf],[data-wd],[data-ct],[data-close],[data-tk],[data-kf]");if(!t)return;var d=t.dataset;
  if(d.close!==undefined){closeM();return}
  if(d.p){S.page=d.p;window.scrollTo(0,0)}
  else if(d.a==="eye")EYE=!EYE;
  else if(d.a==="theme"){var h=document.documentElement,cur=h.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");h.setAttribute("data-theme",cur==="dark"?"light":"dark")}
  else if(d.a==="out"||d.a==="logout"){doLogout();return}
  else if(d.a==="refresh"){toast("Refreshing…","refresh-cw");loadAll();return}
  else if(d.a==="reset"){localStorage.removeItem("pxa1");var adm=S.adm;S=JSON.parse(D1);S.adm=adm;toast("Demo data restored");loadAll()}
  else if(d.a==="addm"){modal('<h3>Add match</h3><form id="mf">'+fld("League or event","ml")+'<div class="fg">'+fld("Team A","ma")+fld("Team B","mb")+'</div><div class="fg"><label class="f">Category<select class="in" id="mc"><option>Cricket</option><option>Football</option><option>Kabaddi</option><option>India Specials</option></select></label>'+fld("Start (e.g. 31 Oct, 7:30 PM)","mw")+'</div><div class="ac"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" type="submit">Create match</button></div></form>');return}
  else if(d.a==="addc"){modal('<h3>Create coupon</h3><form id="cf">'+fld("Reward name","cn")+'<div class="fg">'+fld("Code","cc")+fld("Benefit","cd")+'</div>'+fld("Total available","ct","100","number")+'<div class="ac"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" type="submit">Create</button></div></form>');return}
  else if(d.win){var m=MM(d.win);MOD=m.id;modal('<h3>Declare winner</h3><small>'+esc(m.l)+'. This settles all '+num(m.n)+' predictions.</small><form id="sw" style="margin-top:14px"><label class="opt"><input type="radio" name="w" value="a"> '+esc(m.a)+'</label><label class="opt"><input type="radio" name="w" value="b"> '+esc(m.b)+'</label><label class="opt"><input type="radio" name="w" value="void"> Void match (refund entries)</label><div class="ac"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" type="submit">Confirm winner</button></div></form>');return}
  else if(d.cl){MM(d.cl).st="closed";act("Predictions closed: "+MM(d.cl).a+" vs "+MM(d.cl).b);toast("Predictions closed")}
  else if(d.dm){var m=MM(d.dm);S.matches=S.matches.filter(function(x){return x!==m});act("Match deleted: "+m.a+" vs "+m.b);toast("Match deleted","trash-2")}
  else if(d.uv){var u=U(d.uv);modal('<h3>'+esc(u.name)+'</h3><div class="kv"><span>Email</span><span>'+esc(u.email)+'</span><span>City</span><span>'+esc(u.city)+'</span><span>Wallet</span><span>'+fm(u.wal)+'</span><span>Points</span><span>'+u.pts+'</span><span>Joined</span><span>'+esc(u.joined)+'</span><span>Status</span><span>'+u.st+'</span></div><h3 style="margin-top:16px">Recent transactions</h3>'+(S.tx.filter(function(x){return x.uid===u.id}).slice(0,4).map(function(x){return '<div class="ls"><div>'+x.ty+' · '+esc(x.amt)+'<small>'+esc(x.n)+' · '+esc(x.d)+'</small></div></div>'}).join("")||'<small>No transactions yet.</small>')+'<div class="ac" style="margin-top:14px"><button class="btn g" data-close>Close</button></div>');return}
  else if(d.un){CPS.aud="one";CPS.uid=d.un;S.page="not"}
  else if(d.uw){var u=U(d.uw);MOD=u.id;modal('<h3>Adjust wallet · '+esc(u.name)+'</h3><small>Current balance '+fm(u.wal)+'</small><form id="wf" style="margin-top:14px"><div class="fg"><label class="f">Action<select class="in" id="wt"><option value="c">Credit</option><option value="d">Debit</option></select></label>'+fld("Amount (₹)","wa","","number")+'</div>'+fld("Reason","wr")+'<div class="ac"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" type="submit">Apply</button></div></form>');return}
  else if(d.ub){doBlock(d.ub);return}
  else if(d.wf)WF=d.wf;
  else if(d.kf)TKF=d.kf;
  else if(d.tk){openTicket(d.tk);return}
  else if(d.wd){var p=d.wd.split("|");doWd(p[0],p[1]);return}
  else if(d.ct!==undefined){S.cp[d.ct].on=S.cp[d.ct].on?0:1}
  save();render()});
/* ---------- start ---------- */
var BOOTED=0;
async function enter(session){
  var em=String(session.user.email||"").toLowerCase();
  if(ADMIN_EMAILS.length&&ADMIN_EMAILS.map(function(x){return x.toLowerCase()}).indexOf(em)<0){
    toast("This Google account is not an admin","circle-alert");
    await db.auth.signOut();
    return;
  }
  if(BOOTED&&LOGIN)return;
  BOOTED=1;LOGIN=1;S.adm=session.user.email;
  cleanUrl();
  render();
  await loadAll();
}
async function boot(){
  if(!db){render();return}
  /* listener: reacts to sign in and sign out */
  db.auth.onAuthStateChange(function(ev,session){
    if(session&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION")){setTimeout(function(){enter(session)},0)}
    else if(ev==="SIGNED_OUT"){LOGIN=0;BOOTED=0;render()}
  });
  /* check current session (also processes the token in the URL after Google redirects back) */
  try{
    var s=await db.auth.getSession();
    if(s.data&&s.data.session)enter(s.data.session);
    else render();
  }catch(e){render()}
}
boot();
</script>
