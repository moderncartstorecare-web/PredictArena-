}
:root[data-theme="dark"]{
  --bg:#090c12;--sf:#10141d;--s2:#171c27;--ink:#e8ecf4;--i2:#a2aab9;--i3:#6f7789;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
svg.lucide{width:16px;height:16px;stroke-width:2;flex:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.mut{color:var(--i3)}.t2{color:var(--i2)}.s12{font-size:12px}.s11{font-size:11px}.ok{color:var(--ok)}.no{color:var(--no)}.b{font-weight:600}.grow{flex:1;min-width:0}

.chat-box{padding:10px;border-top:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;gap:8px}
.tw{position:fixed;left:0;right:0;bottom:18px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.ts{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 25px rgba(0,0,0,.25)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--sb)}
.login .card{width:100%;max-width:380px;padding:28px;background:var(--sf);border:1px solid var(--ln)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.sla-badge{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:11px;padding:2px 7px;border-radius:6px}
.sla-urgent{background:var(--nos);color:var(--no);animation:pulse 1.5s infinite}
.sla-wait{background:var(--ams);color:var(--am)}
@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
@media(max-width:900px){
  .shell{flex-direction:column}
  .nav{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;z-index:80;width:260px}
  .nav.open{transform:none}
  .top{padding:12px 16px}.pg{padding:14px}
  .two{grid-template-columns:1fr}
  .mob{display:inline}.hm{display:none}
}
@media(min-width:900px){
  .r{grid-template-columns:var(--c)}
  .rh{display:grid}.hm{display:block}.mob{display:none}
  .top .sub{display:block}
}
</style>

<script>

var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var $ = function(i){ return document.getElementById(i); };
var inr = function(n){ return "₹" + Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: 0}); };

var toast = function(m, icon) {
  var n = document.createElement("div");
  n.className = "ts";
  n.innerHTML = '<i data-lucide="' + (icon || "check-circle") + '" style="width:16px;height:16px"></i><span>' + esc(m) + '</span>';
  $("tw").appendChild(n);
  try { lucide.createIcons(); } catch(e){}
  setTimeout(function(){ n.remove(); }, 2800);
};

var hp = async function(s) {
  var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("cricpulse_salt_2026:" + s));
  return [...new Uint8Array(b)].map(function(x){ return x.toString(16).padStart(2, "0"); }).join("");
};

var S = {
  users: [],
  matches: [],
  wds: [],
  txs: [],
  tickets: [],
  coupons: [],
  notifs: [],
  cfg: {

    registrations_open: true,
    min_deposit: 10,
    min_withdrawal: 100,
    banner_message: ""
  }
};

  dr: null,
  q: "",
  uf: "all",
  tf: "open",
  tp: "all",
  wf: "pending",
  wt: "w",

};

  email: ""
};

var bd = function(t, c){ return '<span class="badge ' + (c || "") + '">' + esc(t) + '</span>'; };
var CS = { active:"b-ok", blocked:"b-no", open:"b-no", pending:"b-am", resolved:"b-ok", closed:"" };
var sb = function(s){ return bd(s, CS[s] || ""); };
var kpi = function(l, v, s, isMoney) {
  return '<div class="card kpi"><small>' + l + '</small><b class="' + (isMoney && !U.eye ? 'bl' : '') + '">' + v + '</b><span>' + (s || "&nbsp;") + '</span></div>';
};
var chips = function(a, cur, L) {

  }).join("") + '</div>';
};
var row = function(cols, inner, attr) {
  return '<' + (attr ? "button" : "div") + ' class="r" style="--m:' + cols[0] + ';--c:' + cols[1] + '" ' + (attr || "") + '>' + inner + '</' + (attr ? "button" : "div") + '>';
};

function formatTimer(dateStr) {
  if (!dateStr) return "00m 00s";
  var diff = Math.max(0, Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000));
  var m = Math.floor(diff / 60);
  var s = diff % 60;
  return (m < 10 ? "0" + m : m) + "m " + (s < 10 ? "0" + s : s) + "s";
}

async function loadAll() {
  if (!db) return;
  try {
    var [cfgRes, uRes, wdRes, mRes, tkRes, txRes, cpRes] = await Promise.all([
      db.from("app_config").select("*").eq("id", "primary").single(),
      db.from("users").select("*, wallet(balance, points)").order("created_at", { ascending: false }),
      db.from("withdrawal_requests").select("*").order("created_at", { ascending: false }),
      db.from("matches").select("*").order("created_at", { ascending: false }),
      db.from("support_tickets").select("*, ticket_messages(*)").order("created_at", { ascending: false }),
      db.from("transactions").select("*").order("created_at", { ascending: false }).limit(200),
      db.from("coupons").select("*").order("created_at", { ascending: false })
    ]);

    if (cfgRes.data) S.cfg = cfgRes.data;
    if (uRes.data) {
      S.users = uRes.data.map(function(u){
        var wal = Array.isArray(u.wallet) ? (u.wallet[0] || {}) : (u.wallet || {});
        return {
          id: u.id,
          name: u.full_name || u.email.split("@")[0],
          email: u.email,
          city: u.city || "-",
          status: u.status || "active",
          bal: Number(wal.balance != null ? wal.balance : (u.wallet_balance || 0)),
          xp: Number(wal.points || 0),
          joined: u.created_at
        };
      });
    }
    if (wdRes.data) S.wds = wdRes.data;
    if (mRes.data) S.matches = mRes.data;
    if (tkRes.data) {
      S.tickets = tkRes.data.map(function(t){
        var msgs = (t.ticket_messages || []).sort(function(a, b){ return new Date(a.created_at) - new Date(b.created_at); });
        var unread = msgs.filter(function(m){ return m.sender === "user" && !m.is_read; }).length;
        var u = S.users.find(function(x){ return x.id === t.user_id; });
        return {
          id: t.id,
          user_id: t.user_id,
          subject: t.subject || "Customer Inquiry",
          user: u ? u.name : "Customer",
          email: u ? u.email : "-",
          prio: t.priority || "normal",
          status: t.status || "open",
          rating: t.rating || 0,
          close_note: t.close_note || "",
          last_user_reply_at: t.last_user_reply_at || (msgs.length ? msgs[msgs.length - 1].created_at : t.created_at),
          unread: unread,
          msgs: msgs.map(function(m){
            return {
              id: m.id,
              f: m.sender === "admin" ? "admin" : "user",
              text: m.message,
              ts: m.created_at
            };
          })
        };
      });
      // Sort: Open tickets with highest wait times first
      S.tickets.sort(function(a, b){
        if (a.status === "open" && b.status !== "open") return -1;
        if (a.status !== "open" && b.status === "open") return 1;
        return new Date(a.last_user_reply_at) - new Date(b.last_user_reply_at);
      });
    }
    if (txRes.data) S.txs = txRes.data;
    if (cpRes.data) S.coupons = cpRes.data;

    render();
  } catch(e) {
    console.error("Data load failed", e);
  }
}

function initRealtime() {
  if (!db) return;
  db.channel("admin-sync-hub")
    .on("postgres_changes", { event: "*", schema: "public", table: "support_tickets" }, function(){ loadAll(); })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "ticket_messages" }, function(pl){
      var t = S.tickets.find(function(x){ return x.id === pl.new.ticket_id; });
      if (t) {
        t.msgs.push({ id: pl.new.id, f: pl.new.sender === "admin" ? "admin" : "user", text: pl.new.message, ts: pl.new.created_at });
        if (pl.new.sender === "user") {
          t.unread++;
          t.last_user_reply_at = pl.new.created_at;
          t.status = "open";
          toast("Customer sent a message!", "headset");
        }
        render();
        var cs = $("chat-stream");
        if (cs) cs.scrollTop = cs.scrollHeight;
      } else {
        loadAll();
      }
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "withdrawal_requests" }, function(){ loadAll(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "app_config" }, function(pl){
      if (pl.new) { S.cfg = pl.new; render(); }
    })
    .subscribe();
}

function dash() {
  var pw = S.wds.filter(function(w){ return w.status === "pending"; });
  var ot = S.tickets.filter(function(t){ return t.status === "open"; });
  var totalBal = S.users.reduce(function(a, u){ return a + u.bal; }, 0);

document.addEventListener("click", async function(e){
  var t = e.target.closest("[data-a]");
  if (!t) return;
  var a = t.dataset.a, v = t.dataset.v;

  switch(a) {
    case "google-login":
      if (!db) return toast("Supabase not connected", "alert-circle");
      await db.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      break;

    case "verify-pass": {
      var pass = $("master-pass").value;
      var hash = await hp(pass);
      if (hash !== SECURE_PASS_HASH) {
        $("er").textContent = "Passcode incorrect.";
        return;
      }
      sessionStorage.setItem("cp_pass_auth", "1");
      authState.passAuthed = true;
      render();
      loadAll();
      initRealtime();
      break;
    }

    case "logout":
      sessionStorage.removeItem("cp_pass_auth");
      authState.passAuthed = false;
      if (db) await db.auth.signOut();
      window.location.reload();
      break;

    case "nav": U.nav = U.nav ? 0 : 1; render(); break;
    case "go": U.route = v; U.nav = 0; U.dr = null; render(); window.scrollTo(0, 0); break;
    case "eye": U.eye = !U.eye; render(); break;
    case "dx": U.dr = null; render(); break;
    case "uf": U.uf = v; render(); break;
    case "tf": U.tf = v; render(); break;
    case "wf": U.wf = v; render(); break;
    case "ticket": U.dr = { t: "ticket", id: v }; render(); break;
    case "user": U.dr = { t: "user", id: v }; render(); break;
    case "market": U.dr = { t: "market", id: v }; render(); break;

    case "toggle-maint": {
      var val = !S.cfg.maintenance_mode;
      await db.from("app_config").update({ maintenance_mode: val }).eq("id", "primary");
      toast("Maintenance " + (val ? "ACTIVATED" : "DEACTIVATED"));
      loadAll();
      break;
    }

    case "toggle-reg": {
      var val2 = !S.cfg.registrations_open;
      await db.from("app_config").update({ registrations_open: val2 }).eq("id", "primary");
      toast("Registrations " + (val2 ? "Open" : "Closed"));
      loadAll();
      break;
    }

    case "save-banner": {
      var bTxt = $("cfg-banner").value.trim();
      await db.from("app_config").update({ banner_message: bTxt }).eq("id", "primary");
      toast("Banner published live!");
      loadAll();
      break;
    }

    case "save-limits": {
      var md = Number($("min-dep").value) || 10;
      var mw = Number($("min-wd").value) || 100;
      await db.from("app_config").update({ min_deposit: md, min_withdrawal: mw }).eq("id", "primary");
      toast("Limits updated");
      loadAll();
      break;
    }

    case "treply": {
      var rep = $("tr").value.trim();
      if (!rep) return;
      await db.from("ticket_messages").insert({ ticket_id: v, sender: "admin", message: rep, is_read: false });
      await db.from("support_tickets").update({ status: "pending" }).eq("id", v);
      $("tr").value = "";
      toast("Reply sent");
      loadAll();
      break;
    }

    case "tclose": {
      await db.from("support_tickets").update({ status: "closed" }).eq("id", v);
      toast("Ticket closed");
      U.dr = null;
      loadAll();
      break;
    }

    case "treopen": {
      await db.from("support_tickets").update({ status: "open" }).eq("id", v);
      toast("Ticket reopened");
      U.dr = null;
      loadAll();
      break;
    }

    case "wok":
    case "wno": {
      var ok = a === "wok";
      await db.from("withdrawal_requests").update({ status: ok ? "approved" : "rejected" }).eq("id", v);
      if (!ok) {
        var w = S.wds.find(function(x){ return x.id === v; });
        if (w) await db.rpc("admin_adjust_balance", { p_user_id: w.user_id, p_delta: w.amount, p_reason: "Payout refund" });
      }
      toast("Withdrawal " + (ok ? "approved" : "rejected"));
      loadAll();
      break;
    }

    case "uadj": {
      var amt = Number($("ba").value), rsn = $("br").value.trim();
      if (!amt || !rsn) return;
      await db.rpc("admin_adjust_balance", { p_user_id: v, p_delta: amt, p_reason: rsn });
      toast("Balance updated");
      U.dr = null;
      loadAll();
      break;
    }

    case "msave": {
      var isNewM = v === "new";
      var mObj = {
        category: "cricket", league: $("ml").value, team_a: $("ma").value, team_b: $("mb").value,
        odds_a: Number($("oa").value) || 1.85, odds_b: Number($("ob").value) || 2.10, status: "open"
      };
      if (isNewM) await db.from("matches").insert(mObj);
      else await db.from("matches").update(mObj).eq("id", v);
      toast("Match published");
      U.dr = null;
      loadAll();
      break;
    }

    case "mset": {
      var [mId, win] = v.split(":");
      await db.from("matches").update({ status: "settled" }).eq("id", mId);
      toast("Match settled (" + win + " won)");
      U.dr = null;
      loadAll();
      break;
    }

    case "void-match": {
      if (confirm("Void this match and refund all entries?")) {
        await db.from("matches").update({ status: "void" }).eq("id", v);
        toast("Match voided");
        loadAll();
      }
      break;
    }
  }
});

async function checkAuth() {
  if (!db) return render();
  var { data: { session } } = await db.auth.getSession();
  if (session && session.user) {
    var em = String(session.user.email || "").toLowerCase();
    if (ADMIN_EMAILS.indexOf(em) >= 0) {
      authState.googleAuthed = true;
      authState.email = em;
    } else {
      toast("Unauthorized account", "alert-circle");
      await db.auth.signOut();
    }
  }
  render();
  if (authState.googleAuthed && authState.passAuthed) {
    loadAll();
    initRealtime();
  }
}

checkAuth();
</script>
