<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a5cff">
<title>CricPulse Admin – Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f4f6fa;--sf:#ffffff;--s2:#eef1f7;--ink:#0f1729;--i2:#4a5163;--i3:#7a8296;
  --ln:#e3e7ee;--ln2:#d0d6e2;--ac:#1a5cff;--ac2:#1348d6;--acs:#e8efff;
  --ok:#0b8f5e;--oks:#e4f6ee;--no:#d92d4b;--nos:#fdecf0;--am:#a86f0c;--ams:#fdf4e1;
  --sb:#090d16;--sb-tx:#9aa5be;
}
:root[data-theme="dark"]{
  --bg:#090c12;--sf:#10141d;--s2:#171c27;--ink:#e8ecf4;--i2:#a2aab9;--i3:#6f7789;
  --ln:#1f2634;--ln2:#2b3345;--ac:#5b8cff;--ac2:#7ba3ff;--acs:#151f3d;
  --ok:#3ddc97;--oks:#10291f;--no:#fb6a82;--nos:#2b1520;--am:#fbbf24;--ams:#2a2211;
  --sb:#06080d;--sb-tx:#8b95ad;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
svg.lucide{width:16px;height:16px;stroke-width:2;flex:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.mut{color:var(--i3)}.t2{color:var(--i2)}.s12{font-size:12px}.s11{font-size:11px}.ok{color:var(--ok)}.no{color:var(--no)}.b{font-weight:600}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}.bt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack>*+*{margin-top:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--ln2);background:var(--sf);white-space:nowrap;text-align:center;transition:background .15s}
.btn:hover{background:var(--s2)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:var(--ac2)}
.btn.d{color:var(--no);border-color:color-mix(in srgb,var(--no) 40%,var(--ln2))}.btn.d:hover{background:var(--nos)}
.btn.k{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--ln2))}.btn.k:hover{background:var(--oks)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}.btn.w{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--ln2);background:var(--sf);display:grid;place-items:center;color:var(--i2);position:relative;flex:none}
.ib:hover{background:var(--s2)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.card>h3,.card .bt>h3{font-size:14px;font-weight:600;margin-bottom:10px}
.inp,select.inp,textarea.inp{width:100%;height:38px;padding:0 12px;background:var(--sf);border:1px solid var(--ln2);border-radius:9px;font-size:13.5px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:70px}
.inp:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:500;color:var(--i2);margin-bottom:4px}
.err{min-height:18px;color:var(--no);font-size:12px;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--s2);color:var(--i2);white-space:nowrap;text-transform:capitalize}
.b-ok{background:var(--oks);color:var(--ok)}.b-no{background:var(--nos);color:var(--no)}.b-am{background:var(--ams);color:var(--am)}.b-ac{background:var(--acs);color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--ln2);background:var(--sf);color:var(--i2);font-size:12px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.tool .srch{position:relative;flex:1;min-width:180px}.srch svg{position:absolute;left:11px;top:11px;color:var(--i3)}.srch .inp{padding-left:34px}
.av{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px}.kpi small{display:block;font-size:11px;font-weight:600;color:var(--i3);text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.kpi span{font-size:12px;color:var(--i3)}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.r{display:grid;grid-template-columns:var(--m);align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);width:100%}.r:last-child{border:0}
button.r:hover{background:var(--s2)}
.rh{display:none;font-size:11px;font-weight:600;color:var(--i3);text-transform:uppercase;letter-spacing:.05em;background:var(--s2);cursor:default}
.hm{display:none}.mob{display:inline}
.dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--no);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.empty{padding:26px;text-align:center;color:var(--i3)}
.bars{display:flex;gap:8px;align-items:flex-end;height:140px;padding-top:8px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--i3);min-width:0}
.bars i{display:block;width:100%;background:var(--ac);border-radius:5px 5px 0 0;opacity:.88}.bars b{color:var(--ink);font-size:11px}
.sw{position:relative;width:40px;height:22px;flex:none}.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:11px;background:var(--ln2);transition:background .15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{transform:translateX(18px)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln)}.ln:last-child{border:0}
.bl{filter:blur(6px);user-select:none;transition:filter .2s}
.shell{display:flex;min-height:100vh}
.nav{width:240px;background:var(--sb);color:var(--sb-tx);display:flex;flex-direction:column;padding:16px 10px;position:sticky;top:0;height:100vh;flex:none;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#fff;padding:4px 8px 16px;letter-spacing:-.02em}
.mark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.brand small{font-size:10px;font-weight:700;color:var(--ac);background:var(--acs);padding:1px 6px;border-radius:4px;margin-left:auto}
.ng{padding:12px 10px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#55617a}
.nl{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--sb-tx);transition:background .15s,color .15s}
.nl:hover{background:rgba(255,255,255,.05);color:#fff}.nl.on{background:var(--ac);color:#fff;font-weight:600}
.nl .cnt{margin-left:auto;background:var(--no);color:#fff;border-radius:9px;font-size:10.5px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.top h1{font-size:18px;font-weight:700;letter-spacing:-.02em}.top .sub{display:none;color:var(--i3);font-size:13px}
.pg{padding:20px 24px 60px;max-width:1200px;width:100%;margin:0 auto}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(9,12,18,.5);backdrop-filter:blur(2px)}
.dr{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:540px;background:var(--sf);z-index:100;display:flex;flex-direction:column;border-left:1px solid var(--ln);box-shadow:-20px 0 50px rgba(0,0,0,.25)}
.dr>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln)}
.dr .bd{padding:16px;overflow:auto;flex:1}
.chat-container{display:flex;flex-direction:column;height:520px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:13px;word-break:break-word;position:relative}
.msg small{display:block;font-size:10px;opacity:.75;margin-top:4px}
.msg.user{background:var(--s2);color:var(--ink);border-bottom-left-radius:3px}
.msg.admin{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:3px}
.msg.note{background:var(--ams);color:var(--am);border:1px dashed var(--am);align-self:center;max-width:94%;font-size:12px}
.chat-box{padding:10px;border-top:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;gap:8px}
.tw{position:fixed;left:0;right:0;bottom:18px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.ts{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 25px rgba(0,0,0,.25)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--sb)}
.login .card{width:100%;max-width:380px;padding:28px;background:var(--sf);border:1px solid var(--ln)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--no);display:inline-block;margin-right:6px}
@media(max-width:900px){
  .shell{flex-direction:column}
  .nav{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;z-index:80;width:260px}
  .nav.open{transform:none}
  .top{padding:12px 16px}.pg{padding:14px}
  .two{grid-template-columns:1fr}
  .mob{display:inline}.hm{display:none}
}
@media(min-width:900px){
  .r{grid-template-columns:var(--c)}
  .rh{display:grid}.hm{display:block}.mob{display:none}
  .top .sub{display:block}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="dr"></div>
<div class="tw" id="tw"></div>
<input type="file" id="imp" accept="application/json" hidden>

<script>
var SUPABASE_URL = "https://hmiyhdekyqpzkxqiukvb.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_lexqjxd-jNUUvYVTnwawPw_EnBvlHjd";

var MASTER_PASS_HASH = "8f1a17951a8f94ff8a3852084c8d5045db47ff57e4e11fa7a49dd29b4fa03290"; // SHA256 of "cp:Vishal@123"

var db = null;
try {
  if (typeof supabase !== "undefined" && SUPABASE_URL.indexOf("YOUR-") < 0) {
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true }
    });
  }
} catch(e) { console.error("Supabase init failed", e); }

var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var $ = function(i){ return document.getElementById(i); };
var inr = function(n){ return "₹" + Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: 0}); };
var NOW = Date.now(), DAY = 864e5, HR = 36e5;
var uid = function(){ return Math.random().toString(36).slice(2, 8); };
var ago = function(t){
  var s = (Date.now() - new Date(t).getTime()) / 1e3;
  return s < 60 ? "just now" : s < 3600 ? Math.floor(s/60) + "m ago" : s < 86400 ? Math.floor(s/3600) + "h ago" : Math.floor(s/86400) + "d ago";
};
var dt = function(t){ return new Date(t).toLocaleDateString("en-IN", {day:"2-digit", month:"short", year:"numeric"}); };

var bd = function(t, c){ return '<span class="badge ' + (c || "") + '">' + esc(t) + '</span>'; };
var CS = {
  active:"b-ok", suspended:"b-am", blocked:"b-no", banned:"b-no",
  open:"b-ac", pending:"b-am", resolved:"b-ok", closed:"",
  high:"b-no", medium:"b-am", low:"",
  approved:"b-ok", rejected:"b-no", completed:"b-ok", verified:"b-ok", none:""
};
var sb = function(s){ return bd(s, CS[s] || ""); };

var toast = function(m, icon) {
  var n = document.createElement("div");
  n.className = "ts";
  n.innerHTML = '<i data-lucide="' + (icon || "check-circle") + '" style="width:16px;height:16px"></i><span>' + esc(m) + '</span>';
  $("tw").appendChild(n);
  try { lucide.createIcons(); } catch(e){}
  setTimeout(function(){ n.remove(); }, 2800);
};

var hp = async function(s) {
  try {
    var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("cp:" + s));
    return [...new Uint8Array(b)].map(function(x){ return x.toString(16).padStart(2, "0"); }).join("");
  } catch(e) {
    var h = 5381;
    for (var c of ("cp:" + s)) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0;
    return "x" + h;
  }
};

var S = {
  users: [],
  matches: [],
  wds: [],
  txs: [],
  tickets: [],
  coupons: [],
  notifs: [],
  audit: [],
  cfg: {
    maint: 0,
    regOpen: 1,
    manualWd: 1,
    minDep: 50,
    minWd: 100,
    banner: "Welcome to CricPulse! Instant UPI payouts are operational."
  }
};

var U = {
  route: "dash",
  nav: 0,
  dr: null,
  q: "",
  uf: "all",
  tf: "open",
  tp: "all",
  wf: "pending",
  wt: "w",
  xf: "all",
  eye: false
};

var ttl = function(m){ return m.question || (m.team_a + " vs " + m.team_b); };
var pendW = function(){ return S.wds.filter(function(w){ return w.status === "pending"; }); };
var kpi = function(l, v, s, isMoney) {
  return '<div class="card kpi"><small>' + l + '</small><b class="' + (isMoney && !U.eye ? 'bl' : '') + '">' + v + '</b><span>' + (s || "&nbsp;") + '</span></div>';
};
var chips = function(a, cur, L) {
  return '<div class="chips">' + L.map(function(item){
    return '<button class="chip' + (cur === item[0] ? " on" : "") + '" data-a="' + a + '" data-v="' + item[0] + '">' + item[1] + '</button>';
  }).join("") + '</div>';
};
var row = function(cols, inner, attr) {
  return '<' + (attr ? "button" : "div") + ' class="r" style="--m:' + cols[0] + ';--c:' + cols[1] + '" ' + (attr || "") + '>' + inner + '</' + (attr ? "button" : "div") + '>';
};

var log = function(a, t) {
  S.audit.unshift({ ts: Date.now(), a: a, t: t, by: "Admin" });
  S.audit = S.audit.slice(0, 150);
};

async function loadAll() {
  if (!db) return;
  try {
    var [uRes, wRes, wdRes, mRes, pRes, tkRes, txRes, cpRes, nRes] = await Promise.all([
      db.from("users").select("*, wallet(balance, points)").order("created_at", { ascending: false }),
      db.from("wallet").select("*"),
      db.from("withdrawal_requests").select("*").order("created_at", { ascending: false }),
      db.from("matches").select("*").order("created_at", { ascending: false }),
      db.from("predictions").select("*"),
      db.from("support_tickets").select("*, ticket_messages(*)").order("created_at", { ascending: false }),
      db.from("transactions").select("*").order("created_at", { ascending: false }).limit(200),
      db.from("coupons").select("*").order("created_at", { ascending: false }),
      db.from("notifications").select("*").order("created_at", { ascending: false }).limit(50)
    ]);

    if (uRes.data) {
      S.users = uRes.data.map(function(u){
        var wal = Array.isArray(u.wallet) ? (u.wallet[0] || {}) : (u.wallet || {});
        return {
          id: u.id,
          name: u.full_name || u.email.split("@")[0],
          email: u.email,
          city: u.city || "Unknown",
          status: u.status || "active",
          kyc: u.kyc_verified ? "verified" : "none",
          bal: Number(wal.balance != null ? wal.balance : (u.wallet_balance || 0)),
          xp: Number(wal.points || 0),
          joined: u.created_at,
          last: u.created_at,
          picks: 0,
          wins: 0
        };
      });
    }

    if (pRes.data) {
      var userMap = {};
      pRes.data.forEach(function(p){
        userMap[p.user_id] = (userMap[p.user_id] || 0) + 1;
      });
      S.users.forEach(function(u){ u.picks = userMap[u.id] || 0; });
    }

    if (wdRes.data) S.wds = wdRes.data;
    if (mRes.data) S.matches = mRes.data;
    if (tkRes.data) {
      S.tickets = tkRes.data.map(function(t){
        var msgs = (t.ticket_messages || []).sort(function(a, b){ return new Date(a.created_at) - new Date(b.created_at); });
        var unread = msgs.filter(function(m){ return m.sender === "user" && !m.is_read; }).length;
        var u = S.users.find(function(x){ return x.id === t.user_id; });
        return {
          id: t.id,
          user_id: t.user_id,
          subject: t.subject || "Support Request",
          user: u ? u.name : "Member " + String(t.user_id).slice(0, 6),
          email: u ? u.email : "user@cricpulse.in",
          cat: "General",
          prio: t.priority || "medium",
          status: t.status || "open",
          rating: t.rating || 0,
          close_note: t.close_note || "",
          created: t.created_at,
          updated: msgs.length ? msgs[msgs.length - 1].created_at : t.created_at,
          unread: unread,
          msgs: msgs.map(function(m){
            return {
              id: m.id,
              f: (m.sender === "admin" || m.sender === "staff") ? "admin" : (m.sender === "note" ? "note" : "user"),
              text: m.message,
              ts: m.created_at
            };
          })
        };
      });
    }
    if (txRes.data) S.txs = txRes.data;
    if (cpRes.data) S.coupons = cpRes.data;
    if (nRes.data) {
      S.notifs = nRes.data.map(function(n){
        return {
          id: n.id,
          t: n.title,
          d: n.body,
          aud: n.user_id ? "Individual User" : "All Users",
          n: n.user_id ? 1 : S.users.length,
          ts: n.created_at
        };
      });
    }
    render();
  } catch(e) {
    console.error("Data load failed", e);
    toast("Database sync error", "alert-circle");
  }
}

function initRealtime() {
  if (!db) return;
  db.channel("admin-realtime")
    .on("postgres_changes", { event: "*", schema: "public", table: "support_tickets" }, function(){ loadAll(); })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "ticket_messages" }, function(pl){
      var t = S.tickets.find(function(x){ return x.id === pl.new.ticket_id; });
      if (t) {
        t.msgs.push({
          id: pl.new.id,
          f: pl.new.sender === "admin" ? "admin" : "user",
          text: pl.new.message,
          ts: pl.new.created_at
        });
        if (pl.new.sender === "user") t.unread++;
        render();
        var cs = $("chat-stream");
        if (cs) cs.scrollTop = cs.scrollHeight;
      } else {
        loadAll();
      }
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "withdrawal_requests" }, function(){ loadAll(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "wallet" }, function(){ loadAll(); })
    .subscribe();
}

        <div class="fld"><label for="mq">Question (Optional for Team A vs Team B)</label><input class="inp" id="mq" value="${esc(m.question || "")}"></div>
        <div class="g2">
          <div class="fld"><label for="ma">Team A / Option A</label><input class="inp" id="ma" value="${esc(m.team_a)}"></div>
          <div class="fld"><label for="mb">Team B / Option B</label><input class="inp" id="mb" value="${esc(m.team_b)}"></div>
          <div class="fld"><label for="oa">Odds Team A</label><input class="inp" id="oa" type="number" step="0.05" value="${m.odds_a || 1.85}"></div>
          <div class="fld"><label for="ob">Odds Team B</label><input class="inp" id="ob" type="number" step="0.05" value="${m.odds_b || 2.10}"></div>
          <div class="fld"><label for="ca">Crowd Pick % (Team A)</label><input class="inp" id="ca" type="number" value="${m.crowd_a || 50}"></div>
          <div class="fld"><label for="api">CricAPI Match ID</label><input class="inp" id="api" value="${esc(m.cricket_match_id || "")}"></div>
        </div>
        <div class="err" id="er"></div>
        <button class="btn p w" data-a="msave" data-v="${m.id || 'new'}">${isNew ? "Publish Fixture" : "Update Fixture"}</button>

        ${!isNew && m.status !== "settled" ? `
          <div class="card" style="margin-top:14px">
            <h3>Declare Result & Settle Winnings</h3>
            <div class="g2">
              <button class="btn k" data-a="mset" data-v="${m.id}:A">${esc(m.team_a)} Won</button>
              <button class="btn k" data-a="mset" data-v="${m.id}:B">${esc(m.team_b)} Won</button>
            </div>
            <button class="btn sm d w" style="margin-top:8px" data-a="mset" data-v="${m.id}:void">Void Match (Refund Bets)</button>
          </div>
        ` : ""}
      </div>
    `;
  }

  if (d.t === "coupon") {
    h = dhead("Create Coupon Code") + `
      <div class="bd">
        <div class="g2">
          <div class="fld"><label for="cv">Discount Value</label><input class="inp" id="cv" placeholder="10% or ₹100"></div>
          <div class="fld"><label for="cc">Category</label><input class="inp" id="cc" placeholder="Wallet / Perks"></div>
        </div>
        <div class="fld"><label for="ct">Title</label><input class="inp" id="ct" placeholder="e.g. Deposit Match Voucher"></div>
        <div class="fld"><label for="cd">Code</label><input class="inp" id="cd" placeholder="CRIC2026"></div>
        <div class="err" id="er"></div>
        <button class="btn p w" data-a="csave">Save Coupon</button>
      </div>
    `;
  }

  if (d.t === "ticket") {
    var t = S.tickets.find(function(x){ return x.id === d.id; });
    if (!t) return "";

    // Mark as read in DB if has unread
    if (t.unread > 0 && db) {
      db.from("ticket_messages").update({ is_read: true }).eq("ticket_id", t.id).eq("sender", "user").then(function(){});
      t.unread = 0;
    }

    h = dhead(esc(t.subject), String(t.id).slice(0, 8) + " · " + esc(t.user)) + `
      <div class="bd stack">
        <div class="bt">
          <div class="row">Status: ${sb(t.status)} | Priority: ${sb(t.prio)}</div>
          <div class="row">
            ${t.status === "closed" ? `<button class="btn sm k" data-a="treopen" data-v="${t.id}">Reopen</button>` : `<button class="btn sm d" data-a="tclose" data-v="${t.id}">Close Ticket</button>`}
          </div>
        </div>

        ${t.rating ? `<div class="card" style="padding:10px 14px;background:var(--ams);color:var(--am)"><b>Customer Rating:</b> ${"★".repeat(t.rating)} (${t.rating}/5)</div>` : ""}
        ${t.close_note ? `<div class="card" style="padding:10px 14px;background:var(--s2)"><b>Resolution Note:</b> ${esc(t.close_note)}</div>` : ""}

        <div class="chat-container">
          <div class="chat-msgs" id="chat-stream">
            ${t.msgs.map(function(m){
              return `<div class="msg ${m.f}">${esc(m.text)}<small>${m.f === 'admin' ? 'Support Agent' : esc(t.user)} · ${ago(m.ts)}</small></div>`;
            }).join("")}
          </div>
          <div class="chat-box">
            <select class="inp" id="tc" data-a="tcan">
              <option value="">Insert Canned Response…</option>
              <option>Hello! Thanks for reaching out. We are verifying this with our payments gateway.</option>
              <option>This has been resolved on your account. Please log out and back in to see your updated balance.</option>
              <option>Could you please provide your 12-digit UPI reference number (UTR) to locate the transaction?</option>
            </select>
            <textarea class="inp" id="tr" placeholder="Type response to user..."></textarea>
            <div class="row">
              <button class="btn p" data-a="treply" data-v="${t.id}"><i data-lucide="send"></i> Send Reply</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  return `<div class="scrim" data-a="dx"></div><aside class="dr">${h}</aside>`;
}

function shell() {
  var m = META[U.route] || META.dash;
  var pw = pendW().length;
  var ot = S.tickets.filter(function(t){ return t.unread > 0; }).length;
  var cnt = { wallet: pw, tickets: ot };

  return `
    <div class="shell">
      <aside class="nav ${U.nav ? 'open' : ''}">
        <div class="brand">
          <span class="mark"><i data-lucide="trophy"></i></span>
          CricPulse <small>ADMIN</small>
        </div>
        ${NAV.map(function(g){
          return `<div class="ng">${g[0]}</div>` + g[1].map(function(i){
            return `<button class="nl ${U.route === i[0] ? 'on' : ''}" data-a="go" data-v="${i[0]}"><i data-lucide="${i[2]}"></i>${i[1]}${cnt[i[0]] ? `<span class="cnt">${cnt[i[0]]}</span>` : ''}</button>`;
          }).join("");
        }).join("")}
        <div style="margin-top:auto;padding-top:14px">
          <button class="nl" data-a="lock"><i data-lucide="log-out"></i> Lock Panel</button>
        </div>
      </aside>
      ${U.nav ? '<div class="scrim" data-a="nav"></div>' : ''}
      <div class="main">
        <header class="top">
          <button class="ib mob" data-a="nav" aria-label="Menu"><i data-lucide="menu"></i></button>
          <div class="grow">
            <h1>${m[0]}</h1>
            <div class="sub">${m[1]}</div>
          </div>
          <button class="ib" data-a="eye" title="Toggle Private Balance Visibility"><i data-lucide="${U.eye ? 'eye' : 'eye-off'}"></i></button>
          <button class="ib" data-a="theme" title="Toggle Theme"><i data-lucide="${document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon'}"></i></button>
          <button class="ib" data-a="go" data-v="tickets" title="Tickets"><i data-lucide="bell"></i>${ot + pw ? `<span class="dot">${ot + pw}</span>` : ''}</button>
          <span class="av">AD</span>
        </header>
        <main class="pg">${PAGES[U.route]()}</main>
      </div>
    </div>
  `;
}

function authV() {
  return `
    <div class="login">
      <div class="card">
        <div class="brand" style="padding:0 0 16px;color:var(--ink)">
          <span class="mark"><i data-lucide="shield-check"></i></span>
          CricPulse <small>ADMIN</small>
        </div>
        <h2 style="font-size:20px;font-weight:700">Administrator Sign In</h2>
        <p class="mut" style="margin:4px 0 16px">Enter your credentials to manage live markets and financials.</p>
        <div class="fld">
          <label for="pa">Master Passcode</label>
          <input class="inp" id="pa" type="password" placeholder="Enter administrative passcode" autocomplete="current-password">
        </div>
        <div class="err" id="er"></div>
        <button class="btn p w" data-a="login">Unlock Admin Control Room</button>
      </div>
    </div>
  `;
}

var authed = sessionStorage.getItem("cpa_auth") === "1";

function render() {
  var y = window.scrollY;
  $("app").innerHTML = authed ? shell() : authV();
  $("dr").innerHTML = authed ? drawer() : "";
  try { lucide.createIcons(); } catch(e){}
  if (authed) window.scrollTo(0, y);
}

var applyTheme = function(){
  document.documentElement.dataset.theme = localStorage.getItem("cpa_theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
};

var csv = function(name, rows){
  var t = rows.map(function(r){ return r.map(function(c){ return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([t], {type: "text/csv"}));
  a.download = name;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 500);
  log("Exported CSV: " + name, "Reports");
};

document.addEventListener("click", async function(e){
  var t = e.target.closest("[data-a]");
  if (!t) return;
  var a = t.dataset.a, v = t.dataset.v;
  if (t.tagName === "SELECT" || t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && t.type !== "checkbox")) return;

  switch(a) {
    case "login": {
      var p = $("pa").value;
      var hash = await hp(p);
      if (hash !== MASTER_PASS_HASH && p !== "Vishal@123") {
        $("er").textContent = "Incorrect admin passcode entered.";
        return;
      }
      sessionStorage.setItem("cpa_auth", "1");
      authed = true;
      log("Administrator logged in", "Security");
      render();
      loadAll();
      initRealtime();
      break;
    }
    case "lock":
      sessionStorage.removeItem("cpa_auth");
      authed = false;
      U.nav = 0; U.dr = null;
      render();
      break;
    case "nav":
      U.nav = U.nav ? 0 : 1;
      render();
      break;
    case "go":
      U.route = v; U.nav = 0; U.q = ""; U.dr = null;
      render();
      window.scrollTo(0, 0);
      break;
    case "eye":
      U.eye = !U.eye;
      render();
      break;
    case "theme":
      var cur = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("cpa_theme", cur);
      applyTheme();
      render();
      break;
    case "dx":
      U.dr = null;
      render();
      break;
    case "uf": U.uf = v; render(); break;
    case "tf": U.tf = v; render(); break;
    case "wf": U.wf = v; render(); break;
    case "wt": U.wt = v; render(); break;
    case "user": U.dr = { t: "user", id: v }; render(); break;
    case "market": U.dr = { t: "market", id: v }; render(); break;
    case "coupon": U.dr = { t: "coupon", id: v }; render(); break;
    case "ticket":
      U.dr = { t: "ticket", id: v };
      render();
      setTimeout(function(){ var cs = $("chat-stream"); if (cs) cs.scrollTop = cs.scrollHeight; }, 50);
      break;

    case "wok":
    case "wno": {
      var ok = a === "wok";
      var newStatus = ok ? "approved" : "rejected";
      var res = await db.from("withdrawal_requests").update({ status: newStatus }).eq("id", v);
      if (res.error) { toast(res.error.message, "alert-circle"); return; }
      if (!ok) {
        var wItem = S.wds.find(function(x){ return x.id === v; });
        if (wItem) {
          await db.rpc("admin_adjust_balance", { p_user_id: wItem.user_id, p_delta: wItem.amount, p_reason: "Rejected payout refund" });
        }
      }
      toast("Withdrawal " + newStatus);
      log("Withdrawal " + v + " " + newStatus, "Wallet");
      loadAll();
      break;
    }

    case "uadj": {
      var amt = Number($("ba").value), reason = $("br").value.trim();
      if (!amt || !reason) { $("er").textContent = "Provide amount and reason."; return; }
      var rpcRes = await db.rpc("admin_adjust_balance", { p_user_id: v, p_delta: amt, p_reason: reason });
      if (rpcRes.error) { $("er").textContent = rpcRes.error.message; return; }
      toast("Balance adjusted");
      log("Adjusted balance for user " + v + " by " + amt, "Wallet");
      U.dr = null;
      loadAll();
      break;
    }

    case "ublock": {
      var usr = S.users.find(function(x){ return x.id === v; });
      var nStatus = usr.status === "active" ? "blocked" : "active";
      await db.from("users").update({ status: nStatus }).eq("id", v);
      toast("User " + nStatus);
      loadAll();
      break;
    }

    case "ukyc": {
      var usr2 = S.users.find(function(x){ return x.id === v; });
      var nKyc = usr2.kyc !== "verified";
      await db.from("users").update({ kyc_verified: nKyc }).eq("id", v);
      toast("KYC " + (nKyc ? "verified" : "unverified"));
      loadAll();
      break;
    }

    case "msave": {
      var isNewM = v === "new";
      var mObj = {
        category: $("mc").value,
        league: $("ml").value,
        question: $("mq").value.trim() || null,
        team_a: $("ma").value,
        team_b: $("mb").value,
        odds_a: Number($("oa").value) || 1.85,
        odds_b: Number($("ob").value) || 2.10,
        crowd_a: Number($("ca").value) || 50,
        cricket_match_id: $("api").value.trim() || null,
        status: "open"
      };
      if (isNewM) {
        await db.from("matches").insert(mObj);
        toast("Match published!");
      } else {
        await db.from("matches").update(mObj).eq("id", v);
        toast("Match updated!");
      }
      U.dr = null;
      loadAll();
      break;
    }

    case "mset": {
      var [mId, win] = v.split(":");
      await db.from("matches").update({ status: "settled" }).eq("id", mId);
      toast("Match settled (" + win + ")");
      log("Settled match " + mId + " (" + win + " won)", "Markets");
      U.dr = null;
      loadAll();
      break;
    }

    case "csave": {
      var cObj = {
        value: $("cv").value.trim(),
        title: $("ct").value.trim(),
        code: $("cd").value.trim().toUpperCase(),
        category: $("cc").value.trim(),
        is_claimed: false
      };
      await db.from("coupons").insert(cObj);
      toast("Coupon added!");
      U.dr = null;
      loadAll();
      break;
    }

    case "cdel": {
      if (confirm("Delete this coupon?")) {
        await db.from("coupons").delete().eq("id", v);
        toast("Coupon removed");
        loadAll();
      }
      break;
    }

    case "nsend": {
      var title = $("nt").value.trim(), body = $("nd").value.trim(), aud = $("na").value;
      if (!title || !body) { $("er").textContent = "Provide title and message."; return; }
      var notifPayload = {
        title: title,
        body: body,
        icon: "bell",
        user_id: aud === "all" ? null : aud
      };
      await db.from("notifications").insert(notifPayload);
      toast("Notification dispatched!");
      loadAll();
      break;
    }

    case "treply": {
      var rep = $("tr").value.trim();
      if (!rep) return;
      var insRes = await db.from("ticket_messages").insert({
        ticket_id: v,
        sender: "admin",
        message: rep,
        is_read: false
      });
      if (insRes.error) { toast(insRes.error.message, "alert-circle"); return; }
      await db.from("support_tickets").update({ status: "pending" }).eq("id", v);
      $("tr").value = "";
      toast("Reply sent");
      loadAll();
      break;
    }

    case "tclose": {
      var note = prompt("Enter resolution close note for user (optional):");
      await db.from("support_tickets").update({ status: "closed", close_note: note || "" }).eq("id", v);
      toast("Ticket closed");
      U.dr = null;
      loadAll();
      break;
    }

    case "treopen": {
      await db.from("support_tickets").update({ status: "open" }).eq("id", v);
      toast("Ticket reopened");
      U.dr = null;
      loadAll();
      break;
    }

    case "save-cfg": {
      S.cfg.maint = $("cfg-maint").checked ? 1 : 0;
      S.cfg.regOpen = $("cfg-reg").checked ? 1 : 0;
      S.cfg.banner = $("cfg-banner").value.trim();
      toast("Settings updated");
      log("Updated system platform configuration", "Settings");
      break;
    }

    case "exp": {
      if (v === "users") csv("users.csv", [["ID", "Name", "Email", "City", "Balance", "XP", "Status", "Joined"], ...S.users.map(function(u){ return [u.id, u.name, u.email, u.city, u.bal, u.xp, u.status, u.joined]; })]);
      if (v === "txs") csv("transactions.csv", [["ID", "User ID", "Type", "Amount", "Description", "Created"], ...S.txs.map(function(t){ return [t.id, t.user_id, t.type, t.amount, t.description, t.created_at]; })]);
      if (v === "tickets") csv("tickets.csv", [["ID", "User ID", "Subject", "Status", "Priority", "Rating", "Created"], ...S.tickets.map(function(t){ return [t.id, t.user_id, t.subject, t.status, t.prio, t.rating, t.created]; })]);
      if (v === "matches") csv("matches.csv", [["ID", "Category", "League", "Team A", "Team B", "Status"], ...S.matches.map(function(m){ return [m.id, m.category, m.league, m.team_a, m.team_b, m.status]; })]);
      break;
    }
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "tpf") { U.tp = t.value; render(); }
  if (t.id === "tc" && t.value) { $("tr").value = t.value; t.selectedIndex = 0; }
});

document.addEventListener("input", function(e){
  if (e.target.id === "q") { U.q = e.target.value; render(); }
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && U.dr) { U.dr = null; render(); }
  if (e.key === "Enter" && e.target.id === "pa") {
    var b = document.querySelector('[data-a="login"]');
    if (b) b.click();
  }
});

applyTheme();
if (authed) {
  loadAll();
  initRealtime();
} else {
  render();
}
</script>
</body>
</html>
