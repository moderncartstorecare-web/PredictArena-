.pg{padding:24px;max-width:1240px;margin:0 auto;animation:fi .2s}@keyframes fi{from{opacity:0}}

.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px}@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.big{font-size:32px;font-weight:700;line-height:1.1}.mk{transition:filter .15s}.bl{filter:blur(7px);user-select:none}
.erow{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.src{display:flex;gap:26px;flex-wrap:wrap}.src b{display:block;font-size:16px}

.tabs{display:flex;gap:6px}.tabs button{padding:7px 14px;border:1px solid var(--bd);border-radius:7px;background:var(--card);font-weight:500}.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.ls{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.ls:last-child{border:0}.ls>div:last-child{flex:1}.ls small{display:block}
.ico{width:34px;height:34px;border-radius:8px;background:var(--prs);color:var(--pr);display:grid;place-items:center;flex:none}
.kv{display:grid;grid-template-columns:130px 1fr}.kv>*{padding:8px 0;border-bottom:1px solid var(--bd)}.kv>:nth-child(odd){color:var(--mu)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ov{position:fixed;inset:0;background:rgba(8,12,24,.55);display:grid;place-items:center;z-index:60;padding:16px;animation:fi .15s;overflow-y:auto}.md{background:var(--card);border-radius:12px;padding:24px;max-width:480px;width:100%}.md h3{font-size:17px}
.toast{position:fixed;right:20px;top:calc(18px + env(safe-area-inset-top,0px));background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:8px;font-weight:500;z-index:80;display:flex;gap:9px;align-items:center;animation:fi .2s}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--bd);border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:pointer}.opt:has(input:checked){border-color:var(--pr);background:var(--prs)}
@media(max-width:860px){.sb{position:static;height:auto;width:100%;flex-direction:row;overflow-x:auto;padding:8px}.sb h6,.sb .brand,.sb>small{display:none}.nv{width:auto;white-space:nowrap}#app{flex-direction:column}.pg{padding:14px}.tp{padding:10px 14px}.fg{grid-template-columns:1fr}}
</style>

function walletsV(){var ty=["All","Credit","Debit","Reward","Withdrawal","Refund"];return '<div class="hd"><div><h1>Wallet transactions</h1><small>Ledger of every wallet movement</small></div><div class="sp"></div><select class="in" style="width:auto" data-sel="tf">'+ty.map(function(t){return '<option'+(t===TF?" selected":"")+'>'+t+'</option>'}).join("")+'</select></div><div class="g4"><div class="card"><small>Wallet balance (listed users)</small><b>'+fm(S.users.reduce(function(a,u){return a+u.wal},0))+'</b></div><div class="card"><small>Highest balance</small><b>'+fm(Math.max.apply(null,S.users.map(function(u){return u.wal})))+'</b></div></div><div class="card tw"><table><tr><th>User</th><th>Type</th><th>Amount</th><th>Note</th><th>Date</th></tr>'+S.tx.filter(function(t){return TF==="All"||t.ty===TF}).map(function(t){return '<tr><td>'+esc(U(t.uid).name)+'</td><td>'+t.ty+'</td><td style="color:var(--'+(t.amt[0]==="+"?"ok":"bad")+');font-weight:600">'+t.amt[0]+"₹"+num(+t.amt.slice(1))+'</td><td>'+esc(t.n)+'</td><td>'+t.d+'</td></tr>'}).join("")+'</table></div>'}
function wdV(){var l=S.wd.filter(function(w){return WF==="all"||w.st===WF});return '<div class="hd"><div><h1>Withdrawals</h1><small>Review, approve or reject payout requests</small></div></div><div class="tabs" style="margin-bottom:12px">'+["pending","approved","rejected","all"].map(function(f){return '<button class="'+(WF===f?"on":"")+'" data-wf="'+f+'">'+f[0].toUpperCase()+f.slice(1)+'</button>'}).join("")+'</div><div class="card tw"><table><tr><th>Request</th><th>User</th><th>Amount</th><th>Method</th><th>Date</th><th>Status</th><th></th></tr>'+(l.map(function(w){var u=U(w.uid);return '<tr><td><b>'+w.id+'</b></td><td>'+esc(u.name)+'</td><td>'+fm(w.amt)+'</td><td>'+w.m+'<br><small>'+esc(w.ac)+'</small></td><td>'+w.d+'</td><td><span class="chip '+({pending:"wa",approved:"ok",rejected:"no"}[w.st])+'">'+w.st+'</span></td><td><div class="ac">'+(w.st==="pending"?'<button class="btn s k" data-wd="'+w.id+'|approved">Approve</button><button class="btn s r" data-wd="'+w.id+'|rejected">Reject</button>':'')+'</div></td></tr>'}).join("")||'<tr><td colspan="7"><small>No requests in this view.</small></td></tr>')+'</table></div>'}
function notV(){var u=U(CPS.uid),rc=CPS.aud==="all"?48213:CPS.aud==="act"?46980:1;return '<div class="hd"><div><h1>Notifications</h1><small>Send announcements to everyone or to one user</small></div></div><div class="cols"><form class="card" id="nf"><h3>Compose</h3><div class="fg"><label class="f">Audience<select class="in" data-cp="aud"><option value="all"'+(CPS.aud==="all"?" selected":"")+'>All users</option><option value="act"'+(CPS.aud==="act"?" selected":"")+'>Active users only</option><option value="one"'+(CPS.aud==="one"?" selected":"")+'>Particular user</option></select></label>'+(CPS.aud==="one"?'<label class="f">User<select class="in" data-cp="uid">'+S.users.map(function(x){return '<option value="'+x.id+'"'+(x.id===CPS.uid?" selected":"")+'>'+esc(x.name)+'</option>'}).join("")+'</select></label>':'<label class="f">Type<select class="in" data-cp="ty">'+["Promo","Result","Alert","Info"].map(function(t){return '<option'+(t===CPS.ty?" selected":"")+'>'+t+'</option>'}).join("")+'</select></label>')+'</div><label class="f">Title<input class="in" data-cp="t" value="'+esc(CPS.t)+'" maxlength="80" required></label><label class="f">Message<textarea class="in" data-cp="m" rows="4" maxlength="300" required>'+esc(CPS.m)+'</textarea></label><div class="hd" style="margin:0"><small>Recipients: <b>'+num(rc)+'</b></small><div class="sp"></div><button class="btn" type="submit">'+ic("send")+'Send notification</button></div></form><div class="card"><h3>Sent history</h3>'+S.sent.map(function(s){return '<div class="ls"><div class="ico">'+ic("bell")+'</div><div><b>'+esc(s.t)+'</b><small>'+esc(s.m)+'</small><small>'+esc(s.aud)+' · '+num(s.r)+' recipients · '+s.time+'</small></div></div>'}).join("")+'</div></div>'}
function rewV(){return '<div class="hd"><div><h1>Rewards and coupons</h1><small>Manage coupons that users claim with points</small></div><div class="sp"></div><button class="btn" data-a="addc">'+ic("plus")+'Create coupon</button></div><div class="card tw"><table><tr><th>Reward</th><th>Code</th><th>Benefit</th><th>Claimed</th><th>Status</th><th></th></tr>'+S.cp.map(function(c,i){return '<tr><td><b>'+esc(c.n)+'</b></td><td><span class="chip">'+esc(c.code)+'</span></td><td>'+esc(c.dc)+'</td><td>'+c.used+' / '+c.tot+'</td><td><span class="chip '+(c.on?"ok":"")+'">'+(c.on?"Active":"Paused")+'</span></td><td><div class="ac"><button class="btn s g" data-ct="'+i+'">'+(c.on?"Pause":"Activate")+'</button></div></td></tr>'}).join("")+'</table></div>'}
function setV(){return '<div class="hd"><div><h1>Settings</h1></div></div><div class="card"><h3>Admin account</h3><div class="kv"><span>Name</span><span>Administrator</span><span>Email</span><span>'+esc(S.adm||"admin@predictx.edu")+'</span><span>Role</span><span>Super admin</span></div></div><div class="card"><h3>Preferences</h3><div class="ls"><div><b>Appearance</b><small>Switch between light and dark</small></div><button class="btn g" data-a="theme">Toggle theme</button></div><div class="ls"><div><b>Reset demo data</b><small>Restore all sample data</small></div><button class="btn r" data-a="reset">Reset</button></div></div><div class="card"><button class="btn g" data-a="out">'+ic("log-out")+'Sign out</button></div><small>Prototype with sample data. No real payments or personal data are processed.</small>'}
var NV=[["dash","layout-dashboard","Dashboard"],["H","Operations"],["matches","trophy","Matches"],["users","users","Users"],["wallets","wallet","Wallets"],["wd","landmark","Withdrawals"],["H","Engagement"],["not","bell","Notifications"],["rew","gift","Rewards"],["H","System"],["set","settings","Settings"]];
var VT={dash:["Dashboard",dashV],matches:["Matches",matchesV],users:["Users",usersV],wallets:["Wallets",walletsV],wd:["Withdrawals",wdV],not:["Notifications",notV],rew:["Rewards",rewV],set:["Settings",setV]};
function nav(){return NV.map(function(n){return n[0]==="H"?'<h6>'+n[1]+'</h6>':'<button class="nv'+(S.page===n[0]?" on":"")+'" data-p="'+n[0]+'">'+ic(n[1])+n[2]+(n[0]==="wd"&&pendW().length?'<span class="cn">'+pendW().length+'</span>':'')+'</button>'}).join("")}
function loginV(){return '<div id="lg"><form id="lf"><div class="brand" style="margin-bottom:18px"><span>'+ic("shield-check")+'</span>PredictX Admin</div><h1 style="margin-bottom:4px">Admin sign in</h1><small>Authorised administrators only. Demo build.</small><div style="height:16px"></div><label class="f">Email<input class="in" id="em" type="email" value="admin@predictx.edu" required></label><label class="f">Password<input class="in" type="password" value="demo1234" required></label><button class="btn w" type="submit">Sign in</button></form></div>'}
function render(){var r=$("root");
  if(!LOGIN){r.innerHTML=loginV()}
  else{var v=VT[S.page];r.innerHTML='<div id="app"><aside class="sb"><div class="brand"><span>'+ic("shield-check")+'</span>PredictX Admin</div>'+nav()+'<small style="margin-top:auto;padding:8px 10px;color:#6b7694">Educational demo</small></aside><div class="main"><div class="tp"><b>'+v[0]+'</b><div class="sp"></div><small>Today: 29 Oct 2026</small><button class="ib" data-a="eye" aria-label="Show or hide earnings">'+ic(EYE?"eye":"eye-off")+'</button><div class="av">AD</div></div><div class="pg">'+v[1]()+'</div></div></div>'}
  try{lucide.createIcons()}catch(e){}}
function modal(h){var o=document.createElement("div");o.className="ov";o.innerHTML='<div class="md">'+h+'</div>';document.body.appendChild(o);try{lucide.createIcons()}catch(e){}}
function closeM(){var o=document.querySelector(".ov");if(o)o.remove();MOD=null}
function fld(l,id,v,t){return '<label class="f">'+l+'<input class="in" id="'+id+'" type="'+(t||"text")+'" value="'+(v||"")+'" required></label>'}
document.addEventListener("input",function(e){var t=e.target;if(t.id==="uq"){UQ=t.value;$("ut").innerHTML=usersTbl();try{lucide.createIcons()}catch(x){}}if(t.dataset.cp&&(t.dataset.cp==="t"||t.dataset.cp==="m"))CPS[t.dataset.cp]=t.value});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset.sel==="month"){S.mi=+t.value;save();render()}else if(t.dataset.sel==="tf"){TF=t.value;render()}else if(t.dataset.cp){CPS[t.dataset.cp]=t.value;if(t.dataset.cp==="aud"||t.dataset.cp==="uid")render()}});
document.addEventListener("submit",function(e){e.preventDefault();var id=e.target.id;
  if(id==="lf"){LOGIN=1;S.adm=$("em").value}
  else if(id==="mf"){S.matches.unshift({id:Date.now()%100000,c:$("mc").value,l:$("ml").value,a:$("ma").value,b:$("mb").value,when:$("mw").value,st:"upcoming",win:null,pa:50,n:0});act("Match created: "+$("ma").value+" vs "+$("mb").value);closeM();toast("Match added")}
  else if(id==="sw"){var m=MM(MOD),w=document.querySelector("input[name=w]:checked");if(!w)return;m.win=w.value;m.st="settled";var n=Math.round(m.n*(w.value==="void"?0:(w.value==="a"?m.pa:100-m.pa))/100);act("Match settled: "+m.a+" vs "+m.b+" ("+(w.value==="void"?"void, refunds issued":n+" winners rewarded")+")");S.sent.unshift({t:"Result declared",m:m.a+" vs "+m.b+" has been settled.",aud:"Participants",ty:"Result",time:now(),r:m.n});closeM();toast("Winner saved. Participants notified")}
  else if(id==="wf"){var u=U(MOD),a=+$("wa").value,cr=$("wt").value==="c";if(!cr&&a>u.wal){toast("Amount exceeds wallet balance","circle-alert");return}u.wal+=cr?a:-a;S.tx.unshift({uid:u.id,ty:cr?"Credit":"Debit",amt:(cr?"+":"-")+a,n:$("wr").value,d:"29 Oct"});act((cr?"Credited ":"Debited ")+fm(a)+" "+(cr?"to ":"from ")+u.name);closeM();toast("Wallet updated")}
  else if(id==="cf"){S.cp.push({n:$("cn").value,code:$("cc").value.toUpperCase(),dc:$("cd").value,used:0,tot:+$("ct").value,on:1});closeM();toast("Coupon created")}
  else if(id==="nf"){if(!CPS.t||!CPS.m){toast("Add a title and message","circle-alert");return}var one=CPS.aud==="one";S.sent.unshift({t:CPS.t,m:CPS.m,aud:one?U(CPS.uid).name:CPS.aud==="all"?"All users":"Active users",ty:CPS.ty,time:now(),r:one?1:CPS.aud==="all"?48213:46980});act("Notification sent: "+CPS.t);CPS.t="";CPS.m="";toast("Notification sent")}
  save();render()});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-p],[data-a],[data-win],[data-cl],[data-dm],[data-uv],[data-un],[data-uw],[data-ub],[data-wf],[data-wd],[data-ct],[data-close]");if(!t)return;var d=t.dataset;
  if(d.close!==undefined){closeM();return}
  if(d.p){S.page=d.p;window.scrollTo(0,0)}
  else if(d.a==="eye")EYE=!EYE;
  else if(d.a==="theme"){var h=document.documentElement,cur=h.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");h.setAttribute("data-theme",cur==="dark"?"light":"dark")}
  else if(d.a==="out"){LOGIN=0;EYE=0}
  else if(d.a==="reset"){localStorage.removeItem("pxa1");S=JSON.parse(D1);toast("Demo data restored")}
  else if(d.a==="addm"){modal('<h3>Add match</h3><form id="mf">'+fld("League or event","ml")+'<div class="fg">'+fld("Team A","ma")+fld("Team B","mb")+'</div><div class="fg"><label class="f">Category<select class="in" id="mc"><option>Cricket</option><option>Football</option><option>Kabaddi</option><option>India Specials</option></select></label>'+fld("Start (e.g. 31 Oct, 7:30 PM)","mw")+'</div><div class="ac"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" type="submit">Create match</button></div></form>');return}
  else if(d.a==="addc"){modal('<h3>Create coupon</h3><form id="cf">'+fld("Reward name","cn")+'<div class="fg">'+fld("Code","cc")+fld("Benefit","cd")+'</div>'+fld("Total available","ct","100","number")+'<div class="ac"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" type="submit">Create</button></div></form>');return}
  else if(d.win){var m=MM(d.win);MOD=m.id;modal('<h3>Declare winner</h3><small>'+esc(m.l)+'. This settles all '+num(m.n)+' predictions.</small><form id="sw" style="margin-top:14px"><label class="opt"><input type="radio" name="w" value="a"> '+esc(m.a)+'</label><label class="opt"><input type="radio" name="w" value="b"> '+esc(m.b)+'</label><label class="opt"><input type="radio" name="w" value="void"> Void match (refund entries)</label><div class="ac"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" type="submit">Confirm winner</button></div></form>');return}
  else if(d.cl){MM(d.cl).st="closed";act("Predictions closed: "+MM(d.cl).a+" vs "+MM(d.cl).b);toast("Predictions closed")}
  else if(d.dm){var m=MM(d.dm);S.matches=S.matches.filter(function(x){return x!==m});act("Match deleted: "+m.a+" vs "+m.b);toast("Match deleted","trash-2")}
  else if(d.uv){var u=U(d.uv);modal('<h3>'+esc(u.name)+'</h3><div class="kv"><span>Email</span><span>'+esc(u.email)+'</span><span>City</span><span>'+esc(u.city)+'</span><span>Wallet</span><span>'+fm(u.wal)+'</span><span>Points</span><span>'+u.pts+'</span><span>Joined</span><span>'+u.joined+'</span><span>Status</span><span>'+u.st+'</span></div><h3 style="margin-top:16px">Recent transactions</h3>'+(S.tx.filter(function(x){return x.uid===u.id}).slice(0,4).map(function(x){return '<div class="ls"><div>'+x.ty+' · '+x.amt+'<small>'+esc(x.n)+' · '+x.d+'</small></div></div>'}).join("")||'<small>No transactions yet.</small>')+'<div class="ac" style="margin-top:14px"><button class="btn g" data-close>Close</button></div>');return}
  else if(d.un){CPS.aud="one";CPS.uid=d.un;S.page="not"}
  else if(d.uw){var u=U(d.uw);MOD=u.id;modal('<h3>Adjust wallet · '+esc(u.name)+'</h3><small>Current balance '+fm(u.wal)+'</small><form id="wf" style="margin-top:14px"><div class="fg"><label class="f">Action<select class="in" id="wt"><option value="c">Credit</option><option value="d">Debit</option></select></label>'+fld("Amount (₹)","wa","","number")+'</div>'+fld("Reason","wr")+'<div class="ac"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" type="submit">Apply</button></div></form>');return}
  else if(d.ub){var u=U(d.ub);u.st=u.st==="active"?"blocked":"active";act((u.st==="blocked"?"Blocked ":"Unblocked ")+u.name);toast(u.name+" "+u.st)}
  else if(d.wf)WF=d.wf;
  else if(d.wd){var p=d.wd.split("|"),w=S.wd.filter(function(x){return x.id===p[0]})[0],u=U(w.uid);w.st=p[1];if(p[1]==="rejected"){u.wal+=w.amt;S.tx.unshift({uid:u.id,ty:"Refund",amt:"+"+w.amt,n:"Rejected "+w.id,d:"29 Oct"})}act("Withdrawal "+w.id+" "+p[1]+" ("+u.name+")");toast("Withdrawal "+p[1])}
  else if(d.ct!==undefined){S.cp[d.ct].on=S.cp[d.ct].on?0:1}
  save();render()});
render();
</script>
