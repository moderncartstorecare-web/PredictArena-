let MC={};
const inM=(v,i)=>{if(!v)return false;const d=new Date(v),m=MS[i];return d.getFullYear()===m.y&&d.getMonth()===m.m};
function MD(i){
  if(MC[i])return MC[i];
  const m=MS[i],days=i===0?new Date().getDate():new Date(m.y,m.m+1,0).getDate(),dep=Array(days).fill(0),pay=Array(days).fill(0),sum=a=>a.reduce((x,y)=>x+y,0);

}

async function upd(table,idcol,id,patch){if(!db){toast("Database not connected","circle-alert");return false}const r=await db.from(table).update(patch).eq(idcol,id).select();if(r.error){toast("Update failed: "+r.error.message,"circle-alert");return false}if(!r.data||!r.data.length){toast("Nothing was updated. Check your RLS policies.","circle-alert");return false}return true}
async function doBlock(id){const u=U(id);if(u.ghost){toast("User not found","circle-alert");return}const ns=u.st==="active"?"blocked":"active";if(!(await upd("users",COLS.users.id,u.id,{[COLS.users.status]:ns})))return;u.st=ns;act((ns==="blocked"?"Blocked ":"Unblocked ")+u.name);toast(u.name+" "+ns);save();render()}
async function doKyc(id){const u=U(id);if(u.ghost)return;if(!(await upd("users",COLS.users.id,u.id,{[COLS.users.kyc]:!u.kyc})))return;u.kyc=u.kyc?0:1;act("KYC "+(u.kyc?"verified":"reset")+": "+u.name);toast("KYC updated");closeM();render()}
async function credit(uid,delta,why){const r=await db.rpc("admin_adjust_balance",{p_user_id:uid,p_delta:delta,p_reason:why||"Admin update"});if(r.error){toast("Update failed: "+r.error.message,"circle-alert");return null}if(!r.data||r.data.ok===false){toast((r.data&&r.data.message)||"Update failed","circle-alert");return null}return r.data}
async function doWallet(uid,a,cr,why){const u=U(uid);if(u.ghost){toast("User not found","circle-alert");return}if(!(a>0)){toast("Enter an amount above zero","circle-alert");return}if(!cr&&a>u.wal){toast("Amount exceeds wallet balance","circle-alert");return}const d=await credit(u.id,cr?a:-a,why);if(!d)return;u.wal=d.new_balance;S.txl.unshift({uid:u.id,ty:cr?"credit":"debit",amt:cr?a:-a,n:why||"Admin update",d:fdt(new Date()),ts:Date.now()});act((cr?"Credited ":"Debited ")+fm(a)+" "+(cr?"to ":"from ")+u.name);closeM();toast("Wallet updated");rebuildTx();save();render()}
async function doWd(id,st){const w=WDR(id);if(!w)return;if(!(await upd("withdrawal_requests",COLS.wd.id,w.id,{[COLS.wd.status]:st})))return;w.st=st;const u=U(w.uid);if(st==="rejected"&&ST.refund_reject&&!u.ghost){const d=await credit(u.id,w.amt,"Refund: withdrawal "+w.id.slice(0,8)+" rejected");if(d)u.wal=d.new_balance}act("Withdrawal "+w.id.slice(0,8)+" "+st+" ("+u.name+")");toast("Withdrawal "+st);MC={};rebuildTx();save();render()}

  const t=e.target;
  if(t.dataset.sel==="month"){S.mi=+t.value;save();render()}
  else if(t.dataset.sel==="tf"){TF=t.value;render()}
  else if(t.dataset.sel==="uf"){UF=t.value;render()}

  else if(t.dataset.cp){CPS[t.dataset.cp]=t.value;if(t.dataset.cp==="aud"||t.dataset.cp==="uid")render()}

  else if(t.dataset.set){const k=t.dataset.set;if(k==="maintenance"&&t.checked&&!confirm("Turn ON maintenance mode? Visitors will see the maintenance message.")){t.checked=false;return}if(await saveSetting(k,t.checked)){act((t.checked?"Enabled ":"Disabled ")+k.replace("_"," "));toast(k.replace("_"," ")+" "+(t.checked?"ON":"OFF"))}render()}
  else if(t.dataset.setin){const k=t.dataset.setin,v=t.type==="number"?Math.max(0,Number(t.value)||0):t.value.trim();if(await saveSetting(k,v))toast("Saved")}
  else if(t.id==="cr-file"&&t.files&&t.files[0]){const f=t.files[0];if(!f.type.startsWith("image/")){toast("Please choose an image","circle-alert");return}if(f.size>1.5*1024*1024){toast("Image must be under 1.5 MB","circle-alert");return}const rd=new FileReader();rd.onload=()=>tkSend("",rd.result);rd.readAsDataURL(f);t.value=""}
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="cr-in"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();ACT.tksend()}
  if(e.target.id==="gs"&&e.key==="Enter"){UQ=e.target.value;S.page="users";save();render()}
  if(e.key==="Escape")closeM();
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const id=e.target.id;
  if(id==="pf"){
    const el=$("pe"),fails=+(sessionStorage.getItem("cp_fail")||0),until=+(sessionStorage.getItem("cp_until")||0);
    if(Date.now()<until){el.textContent="Too many attempts. Try again in "+Math.ceil((until-Date.now())/1000)+" seconds.";return}
    if(await checkPass($("pw").value)){sessionStorage.removeItem("cp_fail");UNLOCK=true;sessionStorage.setItem("cp_adm_ok","1");if(SESS)enter(SESS);else render()}
    else{const n=fails+1;sessionStorage.setItem("cp_fail",n);if(n>=5){sessionStorage.setItem("cp_until",Date.now()+30000);sessionStorage.setItem("cp_fail",0);el.textContent="Too many attempts. Locked for 30 seconds."}else el.textContent="Incorrect password. "+(5-n)+" attempts left.";$("pw").value=""}
    return}
  if(id==="lf"){doLogin();return}
  if(id==="mf"){
    const dbId=$("mid_db").value,tv=$("mtime").value;
    const d={category:$("mc").value,league:$("ml").value.trim(),team_a:$("ma").value.trim(),team_b:$("mb").value.trim(),question:$("mq").value.trim(),closes_at:tv?new Date(tv).toISOString():new Date(Date.now()+864e5).toISOString(),odds_a:+$("moa").value||1.85,odds_b:+$("mob").value||2.1};
    if(!dbId)d.crowd_a=50;
    const r=dbId?await db.from("matches").update(d).eq("id",dbId):await db.from("matches").insert(d);
    if(r.error)return toast("Error saving match: "+r.error.message,"circle-alert");
    act((dbId?"Updated match ":"Published match ")+d.team_a+" vs "+d.team_b);toast(dbId?"Match updated":"Match published to website");closeM();loadAll();return}
  if(id==="sw"){
    const m=MM(MOD),w=document.querySelector("input[name=w]:checked");if(!m||!w)return;
    const res=await settleMatch(m.id,w.value);if(!res.ok)return toast("Could not settle: "+res.msg,"circle-alert");
    if(res.fallback){const ids=[...new Set(S.preds.filter(p=>p.m===String(m.id)).map(p=>p.uid))];if(ids.length)await db.from("notifications").insert(ids.map(u=>({user_id:u,title:"Result declared",body:`${m.a} vs ${m.b}: ${w.value==="void"?"match voided":(w.value==="a"?m.a:m.b)+" won"}.`,icon:"award"})));toast("Result saved. Payouts were not run because settle_match() is not installed.","circle-alert")}
    else toast("Winner saved. "+(res.wins||0)+" winners paid");
    act("Match settled: "+m.a+" vs "+m.b);closeM();loadAll();return}
  if(id==="wf"){doWallet(MOD,+$("wa").value,$("wt").value==="c",$("wr").value);return}
  if(id==="cf"){S.cp.push({n:$("cn").value,code:$("cc").value.toUpperCase(),dc:$("cd").value,used:0,tot:+$("ct").value,on:1});save();closeM();toast("Coupon created");render();return}
  if(id==="mnf"){const r=await db.from("notifications").insert({user_id:$("mn-uid").value,title:$("mn-t").value,body:$("mn-m").value,icon:"bell"});if(r.error)return toast(r.error.message,"circle-alert");toast("Notification sent");closeM();loadAll();return}
  if(id==="ctf"){
    const tid=$("ct-id").value,note=$("ct-note").value.trim(),r=await db.from("support_tickets").update({status:"closed",close_note:note}).eq("id",tid);
    if(r.error)return toast(r.error.message,"circle-alert");
    const t=TK(tid);if(t){t.st="closed";t.close_note=note;await db.from("notifications").insert({user_id:t.uid,title:"Ticket closed",body:"Your support ticket has been closed. Please rate your experience.",icon:"check"})}
    toast("Ticket closed");closeM();render();loadAll();return}
  if(id==="nf"){
    if(!CPS.t||!CPS.m)return toast("Add a title and message","circle-alert");
    const icon=CPS.ty==="Alert"?"bell":CPS.ty==="Result"?"award":CPS.ty==="Promo"?"gift":"shield";let rows;
    if(CPS.aud==="one"){if(!CPS.uid)return toast("Select a user","circle-alert");rows=[{user_id:CPS.uid,title:CPS.t,body:CPS.m,icon}]}
    else if(CPS.aud==="act")rows=S.users.filter(u=>u.st==="active").map(u=>({user_id:u.id,title:CPS.t,body:CPS.m,icon}));
    else rows=[{user_id:null,title:CPS.t,body:CPS.m,icon}];
    if(!rows.length)return toast("No recipients","circle-alert");
    const r=await db.from("notifications").insert(rows);if(r.error)return toast("Error sending: "+r.error.message,"circle-alert");
    act("Notification sent: "+CPS.t);toast("Notification sent");CPS.t="";CPS.m="";loadAll();return}
});

/* =====================================================================
   AUTH + BOOT
   ===================================================================== */
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
async function checkPass(p){try{if(window.crypto&&crypto.subtle)return(await sha(p))===PASS_HASH}catch(e){}return btoa(p)===PASS_B64}
const authRedirect=()=>location.origin+location.pathname;
const cleanUrl=()=>{if(/access_token|code=|error/.test(location.hash+location.search))history.replaceState(null,"",location.pathname)};
async function doLogin(){
  if(!db){toast("Database not connected","circle-alert");return}
  DENY="";toast("Opening Google sign in...","log-in");
  const r=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:authRedirect(),queryParams:{prompt:"select_account"}}});
  if(r.error)toast("Sign in failed: "+r.error.message,"circle-alert");
}
async function doLogout(){try{if(db)await db.auth.signOut()}catch(e){}try{sessionStorage.removeItem("cp_adm_ok")}catch(e){}LOGIN=0;history.replaceState(null,"",location.pathname);location.reload()}
async function enter(session){
  const em=String(session.user.email||"").toLowerCase();
  if(ADMIN_EMAILS.length&&!ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(em)){DENY=em+" is not an admin account.";UNLOCK=true;LOGIN=0;BOOTED=0;try{await db.auth.signOut()}catch(e){}render();return}
  if(BOOTED&&LOGIN)return;
  BOOTED=1;LOGIN=1;S.adm=session.user.email;cleanUrl();render();
  try{await loadAll();initRealtime();const t=TKM?TK(TKM):null;if(t)loadMsgs(t)}catch(e){console.error(e);toast("Loaded with some errors","circle-alert")}
}
async function boot(){
  if(!db){render();return}
  db.auth.onAuthStateChange((ev,session)=>{
    if(session&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION")){SESS=session;if(UNLOCK)setTimeout(()=>enter(session),0);else render()}
    else if(ev==="SIGNED_OUT"){SESS=null;LOGIN=0;BOOTED=0;render()}
  });
  try{const s=await db.auth.getSession();if(s.data&&s.data.session){SESS=s.data.session;if(UNLOCK)enter(SESS);else render()}else render()}catch(e){render()}
}

/* ---------- realtime ---------- */
let RT=0;
function initRealtime(){
  if(RT||!db)return;RT=1;
  db.channel("adm-msgs").on("postgres_changes",{event:"INSERT",schema:"public",table:"ticket_messages"},p=>{
    const n=p.new,t=TK(n.ticket_id);if(!t){reload();return}
    const m=mapMsg(n);if(t.msgs&&!t.msgs.some(x=>x.id&&x.id===m.id))t.msgs.push(m);
    t.lastTs=m.ts;t.lastSender=n.sender;
    if(n.sender==="user"){
      if(TKM===t.id&&S.page==="sup"){t.unread=0;db.from("ticket_messages").update({is_read:true}).eq("id",n.id).then(()=>{})}
      else{t.unread=(t.unread||0)+1;toast("New message from "+tkUser(t),"life-buoy")}
    }
    if(S.page==="sup"){updateChat();updateList()}else render();
  }).subscribe();
  db.channel("adm-tickets").on("postgres_changes",{event:"INSERT",schema:"public",table:"support_tickets"},()=>{toast("New support ticket","life-buoy");reload()}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"support_tickets"},()=>reload()).subscribe();
  db.channel("adm-money").on("postgres_changes",{event:"INSERT",schema:"public",table:"withdrawal_requests"},()=>{toast("New withdrawal request","landmark");reload()}).on("postgres_changes",{event:"INSERT",schema:"public",table:"payment_requests"},()=>{toast("New deposit request","banknote");reload()}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"wallet"},p=>{const u=S.users.find(x=>x.id===p.new.user_id);if(u&&u.wal!==Number(p.new.balance)){u.wal=Number(p.new.balance);if(["users","dash","wallets"].includes(S.page))render()}}).subscribe();
  db.channel("adm-users").on("postgres_changes",{event:"INSERT",schema:"public",table:"users"},()=>reload()).on("postgres_changes",{event:"INSERT",schema:"public",table:"predictions"},()=>reload()).subscribe();
}
setInterval(()=>{
  document.querySelectorAll('[data-timer]').forEach(el=>{
    const ts=Number(el.dataset.timer);
    if(!ts)return;
    const s=Math.floor((Date.now()-ts)/1000);
    if(s<60){el.textContent=s+"s"}
    else{const m=Math.floor(s/60);const rs=s%60;el.textContent=m+"m "+rs+"s"}
    if(Date.now()-ts>120000){el.classList.remove('green');el.classList.add('red')}
    else{el.classList.remove('red');el.classList.add('green')}
  });
},1000);
setInterval(()=>{if(LOGIN&&S.page==="sup"&&!document.hidden)updateList()},30000);
 boot();
</script>
