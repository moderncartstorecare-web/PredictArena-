<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>CricPulse Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--ink:#eef2ff;--i2:#9aa6c3;--i3:#5d6b8a;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--ac:#5b8cff;--ac2:#8aaaff;--ok:#3ddc97;--no:#fb6a82;--am:#fbbf24;--sf:rgba(255,255,255,.04);--sf2:rgba(255,255,255,.07);--blur:blur(18px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 800px at 10% -10%,#16203f 0,#0b1020 55%) fixed;color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}input,select,textarea{font:inherit;color:inherit}svg{display:block;flex:none}h1,h2,h3,p{margin:0}
.mut{color:var(--i2)}.s12{font-size:12px}.s11{font-size:11px}.ok{color:var(--ok)}.no{color:var(--no)}.am{color:var(--am)}
.row{display:flex;align-items:center;gap:10px}.bt{display:flex;justify-content:space-between;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.glass{background:var(--sf);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--ln);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--ln2);background:var(--sf2);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.btn.p{background:linear-gradient(135deg,#4f7cff,#7b5cff);border-color:transparent}.btn.ok{background:rgba(61,220,151,.15);border-color:rgba(61,220,151,.3);color:var(--ok)}
.btn.no{background:rgba(251,106,130,.15);border-color:rgba(251,106,130,.3);color:var(--no)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:600;background:var(--sf2);color:var(--i2);white-space:nowrap}
.pill.ok{background:rgba(61,220,151,.14);color:var(--ok)}.pill.no{background:rgba(251,106,130,.14);color:var(--no)}.pill.am{background:rgba(251,191,36,.14);color:var(--am)}
.inp{width:100%;height:42px;padding:0 12px;background:rgba(255,255,255,.05);border:1px solid var(--ln2);border-radius:10px;font-size:14px;color:var(--ink)}.inp:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,140,255,.2)}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.shell{display:grid;grid-template-columns:1fr;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(11,16,32,.65);backdrop-filter:var(--blur);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#4f7cff,#7b5cff);color:#fff}
.main{padding:16px 16px 80px;max-width:1200px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--ln2);background:var(--sf);color:var(--i2);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}.tab.on{background:linear-gradient(135deg,#4f7cff,#7b5cff);border-color:transparent;color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{padding:14px}.kpi small{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--i2)}.kpi b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0}.kpi span{font-size:11px;color:var(--i3)}
.card{padding:14px}.card h3{font-size:14px;font-weight:600;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--i3);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--ln)}
td{padding:10px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}tr:last-child td{border:0}
.empty{padding:28px 10px;text-align:center;color:var(--i3);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.chatwrap{display:grid;grid-template-columns:1fr;gap:10px}.ticket-list{max-height:320px;overflow:auto}
.tk{padding:10px;border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;width:100%;background:var(--sf)}.tk.on{border-color:var(--ac);background:rgba(91,140,255,.08)}
.msgs{height:340px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.15);border-radius:12px;border:1px solid var(--ln)}
.msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.4;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#4f7cff,#7b5cff);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:4px}
.msg small{display:block;font-size:10px;opacity:.65;margin-top:3px}.msg img{max-width:100%;border-radius:8px;margin-top:6px}
.chatbar{display:flex;gap:8px;margin-top:10px}.chatbar input{flex:1}
.login{display:grid;place-items:center;min-height:100dvh;padding:20px}.login .glass{width:100%;max-width:380px;padding:22px}
.footnote{padding:16px 4px;font-size:11px;color:var(--i3);text-align:center}
@media(min-width:860px){.shell{grid-template-columns:220px minmax(0,1fr)}.side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding:16px 12px;border-right:1px solid var(--ln);background:rgba(255,255,255,.02);backdrop-filter:var(--blur)}.topbar{display:none}.main{padding:24px 28px}.tabs{display:none}.side .tab{width:100%;justify-content:flex-start;height:38px;border:0;background:none;color:var(--i2);margin-bottom:4px}.side .tab.on{background:rgba(91,140,255,.16);color:#cfe0ff;border:0}.kpis{grid-template-columns:repeat(4,1fr)}.chatwrap{grid-template-columns:280px minmax(0,1fr)}.ticket-list{max-height:520px}.msgs{height:440px}}
</style>
</head>
<body>
<div id="root"><div class="login"><div class="glass" style="text-align:center"><div class="logo" style="margin:0 auto 10px">✦</div><b>Loading admin…</b></div></div></div>
<script src="config.js"></script>
<script>
const $ = i => document.getElementById(i);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + Number(n||0).toLocaleString("en-IN");
const inr2 = n => "₹" + Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const ic = (p,s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
const I = {
  grid:"M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z",
  users:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  cash:"M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a2 2 0 0 0 0 4h4v-4z",
  chat:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  send:"M22 2 11 13M22 2l-7 20-4-9-9-4z",
  mega:"m3 11 18-5v12L3 14v-3zM11.6 16.8a3 3 0 1 1-5.8-1.6",
  out:"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  check:"M20 6 9 17l-5-5",
  x:"M18 6 6 18M6 6l12 12",
  bolt:"M13 2 3 14h9l-1 8 10-12h-9z",
  shield:"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
};

/* demo data store for admin (real app uses Supabase; empty states shown when no rows) */
const AKEY = "cricpulse_admin_v1";
let A = { route:"dashboard", users:[], withdrawals:[], tickets:[], openTicket:null, sent:[] };
try { const r = JSON.parse(localStorage.getItem(AKEY)); if (r) A = { ...A, ...r }; } catch{}
const saveA = () => { try { localStorage.setItem(AKEY, JSON.stringify(A)); } catch{} };
const authed = () => {
  try { return sessionStorage.getItem("cp_admin") == "1"; } catch { return false; }
};

function loginV() {
  return `<div class="login"><div class="glass">
    <div class="row" style="margin-bottom:14px"><span class="logo">${ic(I.shield,17)}</span><div><b>CricPulse Admin</b><div class="mut s11">Secure console</div></div></div>
    <div class="s12 mut" style="margin-bottom:10px">Sign in with your admin account to continue.</div>
    <div style="margin-bottom:10px"><input class="inp" id="aem" type="email" placeholder="Admin email" autocomplete="email"></div>
    <div style="margin-bottom:10px"><input class="inp" id="apw" type="password" placeholder="Password" autocomplete="current-password"></div>
    <div class="s11 no" id="aerr" style="min-height:16px;margin-bottom:6px"></div>
    <button class="btn p" style="width:100%" onclick="adminLogin()">Sign in</button>
    <div class="s11 mut" style="margin-top:10px">Admin access is restricted. Use your registered admin email.</div>
  </div></div>`;
}

function nav() {
  const tabs = [["dashboard","Dashboard",I.grid],["users","Users",I.users],["withdrawals","Withdrawals",I.cash],["support","Support Inbox",I.chat],["broadcast","Broadcast",I.mega]];
  return `<aside class="side"><div class="brand" style="padding:4px 8px 14px"><span class="logo">${ic(I.bolt,17)}</span><div><div>CricPulse</div><div class="mut s11">Admin console</div></div></div>${tabs.map(([k,l,icn]) => `<button class="tab${A.route==k?" on":""}" data-r="${k}">${ic(icn,15)}${l}</button>`).join("")}<div style="margin-top:auto;padding:10px 8px;border-top:1px solid var(--ln)"><button class="tab" onclick="adminLogout()">${ic(I.out,15)}Sign out</button></div></aside>`;
}

function topbar() {
  return `<header class="topbar"><span class="logo">${ic(I.bolt,16)}</span><b style="flex:1">CricPulse Admin</b><button class="btn sm" onclick="adminLogout()">Sign out</button></header>
  <div class="tabs">${[["dashboard","Dashboard"],["users","Users"],["withdrawals","Withdrawals"],["support","Support"],["broadcast","Broadcast"]].map(([k,l]) => `<button class="tab${A.route==k?" on":""}" data-r="${k}">${l}</button>`).join("")}</div>`;
}

function kpiCard(label, value, sub) { return `<div class="glass kpi"><small>${label}</small><b>${value}</b><span>${sub||""}</span></div>`; }

function dashboardV() {
  const dep = A.withdrawals.filter(w => w.status=="completed").reduce((a,w)=>a+w.amount,0);
  const wd  = A.withdrawals.filter(w => w.status=="approved").reduce((a,w)=>a+w.amount,0);
  const pend = A.withdrawals.filter(w => w.status=="pending").length;
  return `<div class="kpis">
    ${kpiCard("Total users", A.users.length, A.users.length ? "Registered accounts" : "No data yet")}
    ${kpiCard("Deposits", inr(dep), A.users.length ? "Completed" : "No data yet")}
    ${kpiCard("Withdrawals", inr(wd), pend ? pend+" pending approval" : "No data yet")}
    ${kpiCard("Open tickets", A.tickets.filter(t=>t.status!="closed").length, "Support inbox")}
  </div>
  <div class="glass card"><div class="bt"><h3>Recent activity</h3><span class="pill">Live</span></div>
  ${A.withdrawals.length || A.tickets.length ? `<table><thead><tr><th>Type</th><th>Detail</th><th>Amount</th><th>Status</th></tr></thead><tbody>
    ${A.withdrawals.slice(-5).reverse().map(w=>`<tr><td>Withdrawal</td><td>${esc(w.who||"—")}</td><td>${inr(w.amount)}</td><td><span class="pill ${w.status=="pending"?"am":w.status=="approved"?"ok":"no"}">${esc(w.status)}</span></td></tr>`).join("")}
  </tbody></table>` : `<div class="empty"><b>No data</b>Users, deposits and withdrawal activity will appear here.</div>`}</div>`;
}
function usersV() {
  return `<div class="glass card"><div class="bt"><h3>Registered users</h3><span class="pill">${A.users.length}</span></div>
  ${A.users.length ? `<table><thead><tr><th>Name</th><th>Email</th><th>Wallet</th><th>Joined</th></tr></thead><tbody>${A.users.map(u=>`<tr><td>${esc(u.name)}</td><td class="mut">${esc(u.email)}</td><td>${inr(u.balance)}</td><td class="mut">${esc(u.joined||"—")}</td></tr>`).join("")}</tbody></table>` : `<div class="empty"><b>No data</b>Registered users will appear here.</div>`}</div>`;
}
function withdrawalsV() {
  return `<div class="glass card"><div class="bt"><h3>Withdrawal requests</h3><span class="pill">${A.withdrawals.length}</span></div>
  ${A.withdrawals.length ? `<table><thead><tr><th>User</th><th>Amount</th><th>Destination</th><th>Status</th><th></th></tr></thead><tbody>${A.withdrawals.map((w,i)=>`<tr><td>${esc(w.who||"—")}</td><td><b>${inr(w.amount)}</b></td><td class="mut">${esc(w.dest||"—")}</td><td><span class="pill ${w.status=="pending"?"am":w.status=="approved"?"ok":"no"}">${esc(w.status)}</span></td><td style="text-align:right">${w.status=="pending"?`<button class="btn sm ok" onclick="decide(${i},'approved')">${ic(I.check,13)} Approve</button> <button class="btn sm no" onclick="decide(${i},'rejected')">${ic(I.x,13)} Reject</button>`:""}</td></tr>`).join("")}</tbody></table>` : `<div class="empty"><b>No data</b>Withdrawal requests will appear here for approval.</div>`}</div>`;
}
function supportV() {
  if (!A.tickets.length) return `<div class="glass card"><div class="bt"><h3>Support inbox</h3><span class="pill">0</span></div><div class="empty"><b>No data</b>User support tickets will appear here. Replies are visible to users in-app.</div></div>`;
  const t = A.tickets.find(x=>x.id==A.openTicket) || A.tickets[A.tickets.length-1];
  return `<div class="glass card"><div class="bt"><h3>Support inbox</h3><span class="pill">${A.tickets.filter(x=>x.status!="closed").length} open</span></div>
  <div class="chatwrap"><div class="ticket-list">${A.tickets.slice().reverse().map(x=>`<button class="tk${x.id==t.id?" on":""}" data-t="${x.id}"><div class="bt"><b class="s12">${esc(x.subject)}</b><span class="pill ${x.status=="closed"?"":"ok"}">${x.status=="closed"?"Closed":"Open"}</span></div><div class="mut s11">${esc(x.who||"User")} · ${x.msgs.length} msg</div></button>`).join("")}</div>
  <div><div class="msgs" id="amsgs">${t.msgs.map(m=>`<div class="msg ${m.me?"me":"them"}">${m.img?`<img src="${esc(m.img)}" alt="">`:""}${esc(m.text)}<small>${m.me?"Admin":"User"} · ${esc(m.at)}</small></div>`).join("")}</div>
  <div class="chatbar"><input class="inp" id="areply" placeholder="Reply to user…"><button class="btn p" onclick="sendReply()">${ic(I.send,14)} Send</button></div></div></div></div>`;
}
function broadcastV() {
  return `<div class="glass card"><h3>Broadcast push notification</h3><div class="s12 mut" style="margin-bottom:10px">Send a notification to all registered users.</div>
  <div style="margin-bottom:10px"><label class="s12 mut">Title</label><input class="inp" id="bTitle" placeholder="e.g. New markets are live"></div>
  <div style="margin-bottom:10px"><label class="s12 mut">Message</label><textarea class="inp" id="bMsg" placeholder="Write the notification message…"></textarea></div>
  <button class="btn p" onclick="sendBroadcast()">${ic(I.mega,14)} Send to all users</button>
  ${A.sent.length ? `<div style="margin-top:16px"><h3>Sent</h3>${A.sent.slice().reverse().map(s=>`<div class="tk"><b class="s12">${esc(s.title)}</b><div class="mut s12">${esc(s.msg)}</div><div class="s11 mut">${esc(s.at)}</div></div>`).join("")}</div>` : ""}</div>`;
}

function render() {
  const root = $("root");
  if (!authed()) { root.innerHTML = loginV(); return; }
  const main = A.route=="dashboard"?dashboardV():A.route=="users"?usersV():A.route=="withdrawals"?withdrawalsV():A.route=="support"?supportV():broadcastV();
  root.innerHTML = `<div class="shell">${nav()}<div><div style="padding:0 16px">${topbar()}</div><main class="main">${main}<div class="footnote">CricPulse Admin · Restricted access · ${new Date().getFullYear()}</div></main></div></div>`;
}

/* actions */
window.adminLogin = function() {
  const em = $("aem").value.trim(), pw = $("apw").value;
  const allowed = (window.CP_CONFIG?.ADMIN_EMAILS) || ["admin@cricpulse.com"];
  if (!/^\S+@\S+\.\S+$/.test(em)) { $("aerr").textContent = "Enter a valid email."; return; }
  if (pw.length < 6) { $("aerr").textContent = "Password must be at least 6 characters."; return; }
  // In production, authenticate with Supabase and verify admin role via RLS.
  if (!allowed.includes(em)) { $("aerr").textContent = "This email is not an admin account."; return; }
  try { sessionStorage.setItem("cp_admin","1"); } catch{}
  A.route = "dashboard"; render();
};
window.adminLogout = function() { try { sessionStorage.removeItem("cp_admin"); } catch{} render(); };
window.decide = function(i, status) { A.withdrawals[i].status = status; saveA(); render(); };
window.sendReply = function() {
  const t = A.tickets.find(x=>x.id==A.openTicket) || A.tickets[A.tickets.length-1];
  const inp = $("areply"); if (!t || !inp || !inp.value.trim()) return;
  t.msgs.push({me:true, text:inp.value.trim(), at:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})});
  t.updated = "Just now"; saveA(); render();
  const m = $("amsgs"); if (m) m.scrollTop = m.scrollHeight;
};
window.sendBroadcast = function() {
  const title = $("bTitle").value.trim(), msg = $("bMsg").value.trim();
  if (!title || !msg) return;
  A.sent.push({title, msg, at:new Date().toLocaleString("en-IN")}); saveA(); render();
};

document.addEventListener("click", e => {
  const r = e.target.closest("[data-r]"); if (r) { A.route = r.dataset.r; render(); return; }
  const t = e.target.closest("[data-t]"); if (t) { A.openTicket = Number(t.dataset.t); render(); const m = $("amsgs"); if (m) m.scrollTop = m.scrollHeight; return; }
});
window.addEventListener("load", () => { try { render(); } catch(e) { console.error(e); } });
</script>
</body>
</html>
